/* ---- 1. 倒计时：不再自动重建元旦，删干净就是删干净 ---- */
function drawCd() {
    var box = document.getElementById('shBody');
    if (!box) return;
    S.events = S.events || [];
    var td = today(), now = Date.now();
    var list = S.events.slice().sort(function (a, b) { return evTarget(a) - evTarget(b); });
    var H = '';
    if (!list.length) {
      H = '<div class="card"><div class="empty">还没有事件<br>点下面「+ 添加」，可精确到分钟</div></div>';
    } else {
      H = '<div class="card">' + list.map(function (e) {
        var ms = evTarget(e) - now, past = ms < 0;
        var rN = (e.reminders || []).length;
        return '<div class="row" style="padding:11px 12px;border-radius:14px;background:var(--surf2);' +
          'margin-bottom:8px;border:1px solid ' + (!past && ms < 864e5 ? 'color-mix(in srgb,var(--a1) 34%,transparent)' : 'transparent') + '">' +
          '<span style="font-size:19px">' + (e.emoji || '📌') + '</span>' +
          '<span style="flex:1;min-width:0"><b style="display:block;font-size:14px">' + esc(e.name) + '</b>' +
          '<small class="mut2 xs">' + fmtMD(e.date) + ' ' + (e.time || '00:00') + ' · ' + wd(e.date) +
          (!past ? ' · 还有 ' + fmtLeft(ms) : ' · 已过') + (rN ? ' · ⏰' + rN : '') + '</small></span>' +
          '<button class="iconbtn" data-rm="' + e.id + '" title="提醒设置">⏰</button>' +
          '<button class="iconbtn" data-ed="' + e.id + '" title="编辑">✎</button>' +
          '<button class="iconbtn" data-del="' + e.id + '" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>';
      }).join('') + '</div>';
    }
    var perm = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
    H += '<div class="card"><div class="ch"><h3>通知</h3></div>' +
      '<div class="xs mut2" style="margin-bottom:8px">当前状态：' +
      (perm === 'granted' ? '已开启' : perm === 'denied' ? '已被系统拒绝（需到浏览器设置里打开）' : perm === 'unsupported' ? '此浏览器不支持' : '未开启') + '</div>' +
      (perm === 'default' ? '<button class="btn primary wide" id="evPerm">开启通知提醒</button>' : '') + '</div>';
    box.innerHTML = H;
    var pb = document.getElementById('evPerm');
    if (pb) pb.onclick = function () {
      try { Notification.requestPermission().then(function (p) { toast(p === 'granted' ? '通知已开启' : '未授权'); drawCdV16(); }); }
      catch (e) { toast('此浏览器不支持通知'); }
    };
    box.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () { S.events = S.events.filter(function (x) { return x.id !== b.dataset.del; }); save(); drawCdV16(); };
    });
    box.querySelectorAll('[data-ed]').forEach(function (b) {
      b.onclick = function () { evDlg(b.dataset.ed); };
    });
    box.querySelectorAll('[data-rm]').forEach(function (b) {
      b.onclick = function () { evRemindDlg(b.dataset.rm); };
    });
  }

/* ---- 2. 主页倒计时：严格按开关，全关就不显示 ---- */
function homeCdList() {
  var evs = (S.events || []).map(function (e) { e._d = dayDiff(e.date, today()); return e; });
  var home = evs.filter(function (e) { return e.home === 1; })
    .sort(function (a, b) { return Math.abs(a._d) - Math.abs(b._d); });
  return { home: home, all: evs };
}

/* ---- 3. 今日提醒：只留"要紧的事"——任务 / 习惯 / 倒计时 / 过期 / 预算 ---- */
var RM_SKIP = { rain: 1, uv: 1, dress: 1, diff: 1, water: 1, mood: 1, sleep: 1 };
function buildRemindersBase() {
  var d = getDay(CUR, true), items = [];
  /* 3.1 事件提醒（临近优先） */
  (S.events || []).forEach(function (e) {
    var n = dayDiff(e.date, CUR);
    if (n >= 0 && n <= 30) {
      items.push({
        k: 'cd_' + e.id, e: e.emoji || '📌',
        t: e.name,
        s: n === 0 ? '就是今天 · ' + fmtMD(e.date) : '还有 ' + n + ' 天 · ' + fmtMD(e.date) + ' ' + wd(e.date),
        lv: n === 0 ? 'dg' : n <= 3 ? 'warn' : '', go: 'countdown',
        _o: 0, _n: n
      });
    }
  });
  /* 3.2 过期任务 */
  var over = d.todos.filter(function (t) { return !t.done && t.due && t.due < today(); });
  if (over.length) items.push({
    k: 'over', e: '⏰', t: over.length + ' 件任务已过期',
    s: over.slice(0, 3).map(function (t) { return t.text; }).join('、'), lv: 'dg', go: 'task', _o: 1
  });
  /* 3.3 今天到期 / 高优先级待办 */
  var todayDue = d.todos.filter(function (t) { return !t.done && t.due === today(); });
  if (todayDue.length) items.push({
    k: 'due', e: '📌', t: '今天到期 ' + todayDue.length + ' 件',
    s: todayDue.slice(0, 3).map(function (t) { return t.text; }).join('、'), lv: 'warn', go: 'task', _o: 2
  });
  var prio = d.todos.filter(function (t) { return !t.done && num(t.imp, 5) * num(t.urg, 5) >= 75; });
  if (prio.length) items.push({
    k: 'prio', e: '🔥', t: prio.length + ' 件高优先级待办',
    s: prio.slice(0, 3).map(function (t) { return t.text; }).join('、'), lv: 'warn', go: 'task', _o: 3
  });
  /* 3.4 未打卡习惯 */
  if (S.habits.length) {
    var un = S.habits.filter(function (h) { return !habitDoneOn(h, CUR); });
    if (un.length) items.push({
      k: 'habit', e: '🎯', t: '还有 ' + un.length + ' 个习惯没打卡',
      s: un.slice(0, 4).map(function (h) { return (h.icon || '') + h.name; }).join('、') + '　点这里去打卡',
      lv: '', go: 'habit', _o: 4
    });
  }
  /* 3.5 预算 */
  var bud = num(S.settings.budget, 0);
  if (bud) {
    var mr = monthRange(today()), mo = 0;
    for (var k = mr[0]; k <= mr[1]; k = addDays(k, 1)) mo += peek(k).money.filter(function (m) { return m.type === 'out'; }).reduce(function (a, m) { return a + m.amount; }, 0);
    if (mo > bud) items.push({ k: 'over_bud', e: '💸', t: '本月已超支 ¥' + money(mo - bud), s: '预算 ' + money(bud) + '，已花 ' + money(mo), lv: 'dg', go: 'money', _o: 5 });
    else if (mo / bud >= .8) items.push({ k: 'bud', e: '💰', t: '预算已用 ' + Math.round(mo / bud * 100) + '%', s: '还剩 ¥' + money(bud - mo), lv: 'warn', go: 'money', _o: 5 });
  }
  items.sort(function (a, b) {
    var oa = a._o, ob = b._o;
    if (a.k.indexOf('cd_') === 0) oa = 0;
    if (b.k.indexOf('cd_') === 0) ob = 0;
    if (oa !== ob) return oa - ob;
    if (a._n != null && b._n != null) return a._n - b._n;
    var order = { dg: 0, warn: 1, '': 2 };
    return order[a.lv] - order[b.lv];
  });
  return items;
}

/* 从原文本推断场景 */
function guessEmptyKey(el) {
  var sid = (typeof SHEET !== 'undefined' && SHEET.id) ? SHEET.id : '';
  if (sid && EMPTY_MAP[sid]) return sid;
  var txt = (el.textContent || '');
  if (/任务|待办/.test(txt)) return 'task';
  if (/习惯/.test(txt)) return 'habit';
  if (/学习/.test(txt)) return 'study';
  if (/记账|支出|账/.test(txt)) return 'money';
  if (/专注/.test(txt)) return 'focus';
  if (/睡眠/.test(txt)) return 'sleep';
  if (/成绩|舒尔特/.test(txt)) return 'schulte';
  if (/成就/.test(txt)) return 'achieve';
  if (/倒数|纪念/.test(txt)) return 'countdown';
  if (/天气/.test(txt)) return 'weather';
  if (/水/.test(txt)) return 'water';
  if (/记录|日记|感悟/.test(txt)) return 'journal';
  return 'data';
}

/* 把「一行文字」的空状态升级为四要素结构 */
function enhanceEmpty(el) {
  if (!el || el.getAttribute('data-eok')) return;
  var raw = (el.innerHTML || '').trim();
  if (!raw) return;
  /* 已经是结构化（含标签子节点）的跳过，避免重复包装 */
  /* 注意：正则要带词边界，否则 <br> 里的 <b 会被误判为 <b> 标签 */
  if (/<\s*(svg|div|span|button|b)[\s>]/i.test(raw)) {
    /* 有 iconSvg 的老样式：只补排版 */
    if (el.querySelector('svg')) { el.setAttribute('data-eok','1'); }
    return;
  }
  var cfg = EMPTY_MAP[guessEmptyKey(el)] || EMPTY_MAP.data;
  /* 原文本里若有更有信息量的句子，保留为副标题 */
  var first = raw.split(/<br\s*\/?>/i)[0].replace(/<[^>]+>/g, '').trim();
  var desc = (first && first.length > 6 && first.length < 40 && first !== cfg.t) ? first : cfg.d;
  el.setAttribute('data-eok','1');
  el.innerHTML =
    '<span class="ei">' + cfg.i + '</span>' +
    '<b>' + cfg.t + '</b>' +
    '<div>' + desc + '</div>';
}

/* 在每次渲染后扫描并增强（覆盖 sheet / 弹层 / 主页） */
(function () {
  var timer = null;
  function scan() {
    var list = document.querySelectorAll('.empty:not([data-eok])');
    for (var i = 0; i < list.length; i++) { try { enhanceEmpty(list[i]); } catch (e) { } }
  }
  function soon() { clearTimeout(timer); timer = setTimeout(scan, 30); }

  var _openSheet = openSheet;
  openSheet = function () { var r = _openSheet.apply(null, arguments); soon(); return r; };
  if (typeof openDlg === 'function') {
    var _openDlg = openDlg;
    openDlg = function () { var r = _openDlg.apply(null, arguments); soon(); return r; };
  }
  ['renderHome', 'renderApps', 'renderData', 'renderMine'].forEach(function (fn) {
    if (typeof window[fn] !== 'function') return;
    var o = window[fn];
    window[fn] = function () { var r = o.apply(null, arguments); soon(); return r; };
  });

  /* MutationObserver：任何一次重渲染都能补上，避免被应用内部定时器覆盖 */
  if (window.MutationObserver) {
    var mo = new MutationObserver(soon);
    var start = function () {
      mo.observe(document.body, { childList: true, subtree: true });
      soon();
    };
    if (document.body) start();
    else document.addEventListener('DOMContentLoaded', start);
  }
  /* 兜底轮询：应用内部定时器重渲染后也能补上（开销极小，只查 .empty） */
  setInterval(scan, 400);
})();

/* ========== 第十四轮 B：习惯总览热力图 + 连续天数里程碑 ========== */
/* 依据：
   1. GitHub 贡献图是公认最有效的"一致性可视化"——一眼看出模式与缺口
   2. Streak（连续天数）是习惯类应用的核心驱动力，必须突出且可见
   3. 里程碑（7/30/100 天）要庆祝，这是用户最容易流失的节点
   4. 热力图用明度分级而非布尔，能表达"完成度"而不只是"做了没做" */

/* 计算某个习惯的连续完成天数 */
function habitStreakOf(h) {
  var n = 0, k = today();
  /* 今天没完成不算断（还没到晚上），从昨天往前数 */
  if (!habitDoneOn(h, k)) k = addDays(k, -1);
  for (var i = 0; i < 2000; i++) {
    if (habitDoneOn(h, k)) { n++; k = addDays(k, -1); } else break;
  }
  return n;
}
/* 整体连续天数：当天至少完成一个习惯 */
function habitStreakAll() {
  var n = 0, k = today();
  var any = function (d) { return S.habits.some(function (h) { return habitDoneOn(h, d); }); };
  if (!any(k)) k = addDays(k, -1);
  for (var i = 0; i < 2000; i++) { if (any(k)) { n++; k = addDays(k, -1); } else break; }
  return n;
}
/* 某天的整体完成度 0~1 */
function habitRatio(k) {
  if (!S.habits.length) return 0;
  var c = 0;
  S.habits.forEach(function (h) { if (habitDoneOn(h, k)) c++; });
  return c / S.habits.length;
}
/* 里程碑判定 */
function streakMilestone(n) {
  if (n >= 365) return { n: 365, t: '一整年' };
  if (n >= 100) return { n: 100, t: '一百天' };
  if (n >= 66) return { n: 66, t: '习惯养成期' };
  if (n >= 30) return { n: 30, t: '满月' };
  if (n >= 21) return { n: 21, t: '三周' };
  if (n >= 7) return { n: 7, t: '一周' };
  if (n >= 3) return { n: 3, t: '三天' };
  return null;
}

/* 12 周 × 7 天热力图（GitHub 风格，列 = 周，行 = 星期） */
function habitHeatHtml() {
  if (!S.habits.length) return '';
  var WEEKS = 12, CELL = 'flex:0 0 auto';
  var todayK = today();
  /* 找到本周第一天（周一）往前推 WEEKS-1 周 */
  var td = parseD(todayK);
  var dow = (td.getDay() + 6) % 7;           /* 周一=0 */
  var weekStart = addDays(todayK, -dow);
  var start = addDays(weekStart, -(WEEKS - 1) * 7);
  var cells = '';
  for (var w = 0; w < WEEKS; w++) {
    cells += '<span class="hc">';
    for (var dd = 0; dd < 7; dd++) {
      var k = addDays(start, w * 7 + dd);
      var r = habitRatio(k);
      var lv = r <= 0 ? 0 : r < .34 ? 1 : r < .67 ? 2 : r < 1 ? 3 : 4;
      var fut = k > todayK;
      cells += '<i class="hcell l' + lv + (fut ? ' fut' : '') + (k === todayK ? ' td' : '') +
        '" data-hd="' + k + '" title="' + k + ' · ' + Math.round(r * 100) + '%"></i>';
    }
    cells += '</span>';
  }
  var st = habitStreakAll();
  var ms = streakMilestone(st);
  var wk = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return habitRatio(addDays(weekStart, i)); });
  var wkDone = wk.filter(function (r) { return r > 0; }).length;
  return '<div class="card tight hov" style="margin-bottom:10px">' +
    '<div class="ch" style="margin-bottom:8px"><h3>坚持轨迹</h3><span class="sp">' +
    (st > 0 ? '<span class="hs' + (ms ? ' hot' : '') + '">🔥 连续 ' + st + ' 天</span>' : '<span class="xs mut2">还没有连续记录</span>') +
    '</span></div>' +
    '<div class="hgrid">' + cells + '</div>' +
    '<div class="hfoot">' +
    '<span class="xs mut2">最近 12 周</span>' +
    '<span class="xs mut2" style="margin-left:auto">本周 ' + wkDone + '/7 天 · 完成度 ' +
    Math.round(wk.reduce(function (a, b) { return a + b; }, 0) / 7 * 100) + '%</span>' +
    '</div>' +
    (ms ? '<div class="hms">🏅 已达成「' + ms.t + '」· 连续 ' + st + ' 天，' +
      (st >= 365 ? '这是了不起的一年' :
        st >= 100 ? '你已经把它变成生活的一部分' :
          st >= 30 ? '习惯正在成形，继续' :
            st >= 7 ? '第一周站稳了，别停' : '好的开始') + '</div>' : '') +
    '</div>';
}

/* ---- 1. 统一的导入核心：兼容 v1/v2/v3，缺字段自动补全，返回可读摘要 ---- */
function importBackup(text, opt) {
  opt = opt || {};
  var o;
  try { o = JSON.parse(text); } catch (e) { return { ok: false, msg: '不是有效的 JSON 文件' }; }
  if (!o || typeof o !== 'object') return { ok: false, msg: '文件内容为空或格式不对' };
  /* 兼容被包了一层的情况 */
  if (o.data && typeof o.data === 'object' && !o.days) o = o.data;
  if (o.state && typeof o.state === 'object' && !o.days) o = o.state;
  var hasAny = o.days || o.habits || o.events || o.settings || o.extra || o.game;
  if (!hasAny) return { ok: false, msg: '没找到可识别的数据，请确认是本应用导出的备份' };

  var ver = o.v || (o.settings && o.settings.__v) || 0;
  var next = JSON.parse(JSON.stringify(DEF));
  /* 判断是否为新版：有 v3 标记，或含有 v3 独有的字段 */
  var isV3 = ver === 3 ||
    !!(o.settings && (o.settings.apps || o.settings.achPerFocus != null ||
      o.settings.exRate != null || o.settings.focusGoal != null));

  if (isV3) {
    /* 新版：直接深合并，缺的字段用默认值补 */
    next = deepMerge(JSON.parse(JSON.stringify(o)), next);
  } else {
    /* 旧版 v1/v2：逐项迁移 */
    try {
      var st = o.settings || {};
      ['theme', 'accent', 'fs', 'hour24', 'sound', 'focus', 'short', 'long', 'rounds',
        'autoNext', 'noise', 'noiseVol', 'name', 'avatar', 'motto', 'rainAlert', 'budget',
        'waterGoal', 'waterCup', 'taskSort', 'achPerFocus', 'achPerMin', 'focusGoal',
        'exRate', 'exMoney', 'initBalance', 'dots', 'remindOff'].forEach(function (k) {
          if (st[k] != null) next.settings[k] = st[k];
        });
      if (st.city) next.settings.city = st.city;
      if (st.cities) next.settings.cities = st.cities;
      next.habits = (o.habits || []).map(function (h) {
        return {
          id: h.id, name: h.name, icon: h.icon || '✓', freq: h.freq || 'd',
          times: num(h.times, 1), ach: num(h.ach, 5), createdAt: h.createdAt || h.at || 0
        };
      });
      next.events = (o.events || []).map(function (e) {
        return { id: e.id, name: e.name, date: e.date, emoji: e.emoji || '📌', home: e.home ? 1 : 0 };
      });
      Object.keys(o.days || {}).forEach(function (d) {
        var y = o.days[d], n = blank(d);
        n.todos = (y.todos || []).map(function (t) {
          return {
            id: t.id, text: t.text, done: !!t.done,
            imp: num(t.imp, t.pri == 3 ? 15 : t.pri == 1 ? 1 : 5),
            urg: num(t.urg, 5), diff: num(t.diff, 5),
            q: num(t.q, 3), note: t.note || '', due: t.due || '',
            at: t.at || 0, doneAt: t.done ? (t.doneAt || t.at || 0) : 0
          };
        });
        n.focus = y.focus || []; n.money = y.money || []; n.habits = y.habits || {};
        n.water = num(y.water, 0); n.mood = num(y.mood, 0);
        n.good = y.good || ['', '', '']; n.text = y.text || '';
        n.tags = y.tags || []; n.note = y.note || '';
        var sl = y.sleep; if (sl) n.sleep = { h: num(sl.h, 0), up: sl.up || '', ach: num(sl.ach, 0) };
        var sd = y.study; if (sd) n.study = { h: num(sd.h, 0), q: num(sd.q, 3), ach: num(sd.ach, 0), note: sd.note || '' };
        next.days[d] = n;
      });
      next.extra = o.extra || [];
      next.exchange = o.exchange || [];
      if (o.game) next.game = { schulte: o.game.schulte || {}, history: o.game.history || [] };
    } catch (e2) { return { ok: false, msg: '数据迁移失败：' + (e2.message || '未知错误') }; }
  }
  if (!next.days || typeof next.days !== 'object') next.days = {};
  next.v = 3;
  if (!opt.silent) {
    S = next;
    saveNow();
    try { localStorage.setItem('lumen.bakAt', String(Date.now())); } catch (e) { }
  }
  var ds = Object.keys(next.days).length;
  return {
    ok: true, msg: '导入成功', v: ver,
    sum: ds + ' 天记录 · ' + (next.habits || []).length + ' 个习惯 · ' +
      (next.events || []).length + ' 个事件提醒' +
      (isV3 ? '' : '（来自旧版' + (ver ? ' v' + ver : '') + '，已自动升级为新版格式）')
  };
}

/* ========== 修复首屏渲染：补丁注册完后只重渲染一次（在启动遮罩下完成，无闪烁） ========== */
/* 原因：init() 在 q7 里执行，而 q19~q30 的包装补丁在它之后才注册，
   首屏用的是未打补丁的旧逻辑。这里补渲染一次；boot 层会延迟淡出，所以看不到闪烁。 */
(function () {
  if (window.__bootFix) return;

  }
  /* 同步补渲染一次：此时 boot 遮罩仍在，用户不可见 */
  once();
  /* 布局稳定后只做轻量校准（加 class），绝不重建 DOM，避免二次闪烁 */
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      try {
        var p = document.getElementById('p-mine');
        if (p && p.classList.contains('on') && p.clientHeight) {
          if (p.scrollHeight > p.clientHeight + 4) p.classList.add('compact');

})();

          (jumpFlag ? '<b style="color:var(--danger)">' + deltaTxt + '，变化较大</b>' : deltaTxt) +

  var tDress = dressAdvice(Math.round((tMax + tMin) / 2));

  h += row('今天', fmtMD(today()) + ' ' + wd(today()) + ' · ' + tWI.name, tDress, tPop, tCode, warnTY, dTxtTY, jumpTY, tMin, tMax);
  h += row('明天', '明日 · ' + nWI.name, nDress, nPop, nCode, warnNT, dTxtNT, jumpNT, nMin, nMax);
  h += '</div>';

/* 数据结构：day.imgs = [{d: dataURL, n: 说明}] */

/* 通用：选图 → 等比压缩 → 回调（限制最长边，控制体积） */
function pickImage(maxSide, cb) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) { document.body.removeChild(inp); return; }
    var rd = new FileReader();
    rd.onload = function () { shrink(rd.result, maxSide, function (u) { cb(u); try { document.body.removeChild(inp); } catch (e) { } }); };
    rd.onerror = function () { try { document.body.removeChild(inp); } catch (e) { } };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function shrink(dataUrl, maxSide, cb) {
  var im = new Image();
  im.onload = function () {
    try {
      var m = Math.max(im.width, im.height);
      var sc = m > maxSide ? maxSide / m : 1;
      var w = Math.max(1, Math.round(im.width * sc)), h = Math.max(1, Math.round(im.height * sc));
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      var out = cv.toDataURL('image/jpeg', .82);
      /* 体积仍过大则再降一档 */
      if (out.length > 220000) out = cv.toDataURL('image/jpeg', .62);
      cb(out);
    } catch (e) { cb(dataUrl); }
  };
  im.onerror = function () { cb(dataUrl); };
  im.src = dataUrl;
}

/* ---------- 轻量 Markdown 渲染 ---------- */
function mdHtml(t) {
  if (!t) return '';
  var esc1 = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var lines = String(t).split('\n'), out = [], inList = false, inQuote = false;
  function closeL() { if (inList) { out.push('</ul>'); inList = false; } }
  function closeQ() { if (inQuote) { out.push('</blockquote>'); inQuote = false; } }
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    if (/^\s*---+\s*$/.test(ln)) { closeL(); closeQ(); out.push('<hr>'); continue; }
    var mh = ln.match(/^(#{1,3})\s+(.*)$/);
    if (mh) { closeL(); closeQ(); var lv = mh[1].length; out.push('<h' + (lv + 2) + '>' + inl(mh[2]) + '</h' + (lv + 2) + '>'); continue; }
    var mq = ln.match(/^\s*&gt;\s?(.*)$/) || ln.match(/^\s*>\s?(.*)$/);
    if (mq) { closeL(); if (!inQuote) { out.push('<blockquote>'); inQuote = true; } out.push(inl(mq[1])); continue; }
    var ml = ln.match(/^\s*[-*+]\s+(.*)$/);
    if (ml) { closeQ(); if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inl(ml[1]) + '</li>'); continue; }
    var mn = ln.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (mn) { closeQ(); if (!inList) { out.push('<ul class="ol">'); inList = true; } out.push('<li>' + inl(mn[2]) + '</li>'); continue; }
    closeL(); closeQ();
    out.push(ln.trim() === '' ? '<div class="mgap"></div>' : '<p>' + inl(ln) + '</p>');
  }
  closeL(); closeQ();
  function inl(s) {
    s = esc1(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
  }
  return out.join('');
}

    /* 内容卡 */

        n.imgs.map(function (im, i) {

        }).join('') + '</div>';

    }

    /* 信息 */
    $('#shBody').classList.add('nvfull');
    var dc = new Date(n.at), du = new Date(n.up || n.at);

      '</div>';
    /* 上一条/下一条 */

    list = list.slice().sort(function (a, b) { return (!!b.pin - !!a.pin); });
    var idx = list.findIndex ? list.findIndex(function (x) { return x.id === id; }) : -1;

/* ---------- 图片查看器（多图左右切换） ---------- */
function imgViewer(imgs, idx) {
  if (!imgs || !imgs.length) return;
  var cur = idx || 0;
  var host = document.createElement('div');
  host.className = 'imgv';
  host.innerHTML =
    '<div class="imgvmask"></div>' +
    '<div class="imgvbox">' +
    '<img id="ivImg" src="' + imgs[cur].d + '">' +
    '<div class="imgvbar">' +
    '<button id="ivPrev">‹</button>' +
    '<span id="ivCnt">' + (cur + 1) + ' / ' + imgs.length + '</span>' +
    '<button id="ivNext">›</button>' +
    '<button id="ivClose">关闭</button>' +
    '</div>' +
    (imgs[cur].n ? '<div class="imgvcap" id="ivCap">' + esc(imgs[cur].n) + '</div>' : '') +
    '</div>';
  document.body.appendChild(host);
  function show(i) {
    cur = (i + imgs.length) % imgs.length;
    document.getElementById('ivImg').src = imgs[cur].d;
    document.getElementById('ivCnt').textContent = (cur + 1) + ' / ' + imgs.length;
    var c = document.getElementById('ivCap');
    if (c) c.textContent = imgs[cur].n || '';
  }
  host.querySelector('#ivPrev').onclick = function () { show(cur - 1); };
  host.querySelector('#ivNext').onclick = function () { show(cur + 1); };
  host.querySelector('#ivClose').onclick = function () { host.remove(); };
  host.querySelector('.imgvmask').onclick = function () { host.remove(); };
  /* 滑动切换 */
  var sx = 0;
  host.addEventListener('touchstart', function (e) { sx = (e.touches[0] || {}).clientX || 0; }, { passive: true });
  host.addEventListener('touchend', function (e) {
    var ex = ((e.changedTouches || [])[0] || {}).clientX || 0;
    if (sx - ex > 40) show(cur + 1);
    else if (ex - sx > 40) show(cur - 1);
  }, { passive: true });
}

        ta.setSelectionRange(s + p[0].length, s + p[0].length + (sel || '文字').length);
      } else {
        var pre = (s === 0 || v[s - 1] === '\n') ? '' : '\n';

        ta.setSelectionRange(s + pre.length + m.length, s + pre.length + m.length + (sel || '').length);
      }
      ta.focus(); upd();

  });

    var d = new Date(), s = ta.selectionStart;

    ta.value = ta.value.slice(0, s) + stamp + ta.value.slice(ta.selectionEnd);

  };
  function close() { host.remove(); }
  host.querySelector('#feCancel').onclick = close;

/* ========== 8. 便签：数据模型扩展（标题/重要/分类/提醒）+ 迁移 ========== */

function folderName(k) { var f = FOLDERS.filter(function (x) { return x.k === (k || ''); })[0]; return f ? f.n : '未分类'; }

/* 扩展字段默认值（老数据自动补） */

/* 显示用标题：优先 title，其次正文首行 */
function noteTitle(n) {
  if (n.title && n.title.trim()) return n.title.trim();
  var body = noteBody(n) || '';
  var first = body.split('\n').filter(function (x) { return x.trim(); })[0] || '';
  first = first.replace(/^#+\s*/, '').replace(/^\s*[-*+]\s*/, '').replace(/^\s*✓\s*/, '').trim();
  if (first) return first.length > 30 ? first.slice(0, 30) + '…' : first;
  return '';
}
/* 摘要：去掉标题行与 Markdown 符号 */
function noteExcerpt(n, len) {
  len = len || 60;
  var body = noteBody(n) || '';
  var lines = body.split('\n').filter(function (x) { return x.trim(); });
  if (n.title && n.title.trim() === lines[0] && lines[0]) lines = lines.slice(1);
  var t = lines.join(' ');
  t = t.replace(/^#+\s*/gm, '').replace(/^\s*[-*+]\s*/gm, '').replace(/^\s*>\s?/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1').replace(/==([^=]+)==/g, '$1').replace(/~~([^~]+)~~/g, '$1')
    .replace(/^\s*\d+[.)]\s*/gm, '').replace(/\[[ x]\]/g, '').trim();
  return t.length > len ? t.slice(0, len) + '…' : t;
}
/* 搜索匹配范围：标题 + 正文 + 标签 + 分类 */
function noteMatch(n, kw) {
  if (!kw) return true;
  var hay = (noteTitle(n) + '\n' + noteBody(n) + '\n' + (n.tags || []).join(' ') + '\n' + folderName(n.folder)).toLowerCase();
  return hay.indexOf(String(kw).toLowerCase()) >= 0;
}
function noteRemindAt(n) {
  if (!n.remind || !n.remind.at) return 0;
  return n.remind.at - (num(n.remind.lead, 0) * 60000);
}
function remindText(r) {
  if (!r || !r.at) return '';
  var d = new Date(r.at);
  var s = fmtMD(ds(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  var rp = { once: '', day: ' · 每天', week: ' · 每周', month: ' · 每月' }[r.repeat || 'once'] || '';
  var ld = num(r.lead, 0) ? ' · 提前' + r.lead + '分' : '';
  return s + rp + ld;
}

}

/* 回收站过期自动清理 */
function purgeTrash() {
  var keep = num(S.settings.noteKeep, 30);
  if (!keep) return 0;
  var cut = Date.now() - keep * 86400000;
  var before = (S.notes || []).length;
  S.notes = (S.notes || []).filter(function (n) {
    if (!n.del) return true;
    var t = num(n.delAt, n.up || n.at);
    return t > cut;
  });
  var gone = before - (S.notes || []).length;
  if (gone) save();

}

/* ========== 9. 便签列表：过滤胶囊 / 排序 / 视图切换 / FAB / 批量底栏 ========== */

var NOTE_COMPOSING = false;
var NOTE_SORT = 'manual';
var NOTE_FILTER = 'all';

function noteCounts() {
  var all = (S.notes || []).filter(function (n) { return !n.arch && !n.del; });
  var ts = todayStart();
  return {
    all: all.length,
    pin: all.filter(function (n) { return n.pin; }).length,
    today: all.filter(function (n) {
      return (n.up || n.at) >= ts || (n.at >= ts) || (n.remind && n.remind.at >= ts && n.remind.at < ts + 86400000);
    }).length,
    todo: all.filter(noteHasOpenTodo).length,
    imp: all.filter(function (n) { return n.important; }).length,
    arch: (S.notes || []).filter(function (n) { return n.arch && !n.del; }).length,
    trash: (S.notes || []).filter(function (n) { return n.del; }).length
  };
}
var FILTERS = [
  ['all', '全部'], ['pin', '置顶'], ['today', '今天'],
  ['todo', '待办'], ['imp', '重要'], ['arch', '归档'], ['trash', '回收站']
];
function filterList(f) {
  var base = (S.notes || []);
  var ts = todayStart();
  var l = base.filter(function (n) {
    if (f === 'arch') return n.arch && !n.del;
    if (f === 'trash') return n.del;
    return !n.arch && !n.del;
  });
  if (f === 'pin') l = l.filter(function (n) { return n.pin; });
  if (f === 'today') l = l.filter(function (n) {
    return (n.up || n.at) >= ts || (n.remind && n.remind.at >= ts && n.remind.at < ts + 86400000);
  });
  if (f === 'todo') l = l.filter(noteHasOpenTodo);
  if (f === 'imp') l = l.filter(function (n) { return n.important; });
  return l;
}
function sortList(l) {
  var s = NOTE_SORT, arr = l.slice();
  if (s === 'created') arr.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
  else if (s === 'up') arr.sort(function (a, b) { return ((b.up || b.at) || 0) - ((a.up || a.at) || 0); });
  else if (s === 'remind') arr.sort(function (a, b) {
    return (noteRemindAt(a) || 9e15) - (noteRemindAt(b) || 9e15);
  });
  else if (s === 'title') arr.sort(function (a, b) {
    return (noteTitle(a) || '￿').localeCompare(noteTitle(b) || '￿', 'zh');
  });
  /* manual：保持存储顺序。最后统一置顶优先 */
  return arr.sort(function (a, b) { return (!!b.pin - !!a.pin); });
}
var SORT_TXT = { manual: '手动', up: '最近修改', created: '最近创建', remind: '提醒时间', title: '标题 A-Z' };

function noteShellHtml() {
  return '<div class="nfilters" id="nv"></div>' +
    '<div class="row nsr" style="gap:6px;margin-bottom:7px">' +
    '<input class="inp" id="nSearch" type="text" placeholder="搜索标题、内容、标签…" style="flex:1;height:36px"' +
    ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<button class="btn sm" id="nClear" style="display:none;flex:0 0 auto">清空</button>' +
    '<button class="btn sm" id="nSortBtn" style="flex:0 0 auto">排序</button>' +
    '<button class="btn sm" id="nViewBtn" style="flex:0 0 auto">视图</button>' +
    '</div>' +
    '<div class="xs mut2" id="nCount" style="margin-bottom:6px"></div>' +
    '<div id="nTagsWrap"></div>' +
    '<div id="nDynWrap"></div>' +
    '<div id="nListWrap"></div>' +
    '<div id="nFab" title="新建便签">＋</div>';
}

function drawNotes() {
  var host = $('#shBody');
  if (!host) return;
  var kw = (drawNotes._kw || '').trim();
  var fresh = !host.querySelector('#nListWrap');
  if (fresh) host.innerHTML = noteShellHtml();

  var se = $('#nSearch');
  if (fresh && se) {
    se.value = drawNotes._kw || '';
    se.addEventListener('compositionstart', function () { NOTE_COMPOSING = true; });
    se.addEventListener('compositionend', function () {
      NOTE_COMPOSING = false; drawNotes._kw = se.value; drawNotes();
    });
    se.oninput = function () {
      drawNotes._kw = se.value;
      if (NOTE_COMPOSING) return;
      clearTimeout(drawNotes._t);
      drawNotes._t = setTimeout(function () { drawNotes(); }, 110);
    };
    var cl = $('#nClear');
    if (cl) cl.onclick = function () { drawNotes._kw = ''; se.value = ''; drawNotes(); try { se.focus(); } catch (e) { } };
    var sb = $('#nSortBtn');
    if (sb) sb.onclick = function () {
      openDlg({
        title: '排序方式', sub: '置顶的便签始终在最前', ok: false,
        body: '<div style="display:flex;flex-direction:column;gap:7px">' +
          Object.keys(SORT_TXT).map(function (k) {
            return '<button class="btn wide' + (NOTE_SORT === k ? ' primary' : '') + '" data-s="' + k + '">' + SORT_TXT[k] + '</button>';
          }).join('') + '</div>',
        onOpen: function () {
          $$('#dlgHost [data-s]').forEach(function (b) {
            b.onclick = function () { NOTE_SORT = b.dataset.s; setNs('sort', NOTE_SORT); closeDlg(); drawNotes(); };
          });
        }
      });
    };
    var vb = $('#nViewBtn');
    if (vb) vb.onclick = function () {
      var cur = ns('view', 'grid');
      var next = cur === 'grid' ? 'list' : 'grid';
      setNs('view', next); vb.textContent = next === 'grid' ? '视图' : '视图'; drawNotes();
      toast(next === 'grid' ? '卡片网格' : '紧凑列表');
    };
    var fab = $('#nFab');
    if (fab) fab.onclick = function () { noteEdit(null); };
  }
  if (se && se.value !== (drawNotes._kw || '')) se.value = drawNotes._kw || '';
  var cl2 = $('#nClear');
  if (cl2) cl2.style.display = kw ? '' : 'none';

  drawNoteFilters();
  drawNoteTags();
  drawNoteDyn();

  /* 列表 */
  var list = filterList(NOTE_FILTER);
  if (kw) list = list.filter(function (n) { return noteMatch(n, kw); });
  if (NOTE_TAG) list = list.filter(function (n) { return (n.tags || []).indexOf(NOTE_TAG) >= 0; });
  list = sortList(list);

  var cnt = $('#nCount');
  if (cnt) {
    cnt.textContent = kw
      ? (list.length ? '找到 ' + list.length + ' 条“' + kw + '”' : '没有找到“' + kw + '”')
      : (list.length ? '共 ' + list.length + ' 条 · ' + SORT_TXT[NOTE_SORT] : '');
  }

  var lw = $('#nListWrap');
  if (!lw) return;
  var vm = ns('view', 'grid');
  if (!list.length) {
    lw.innerHTML = '<div class="empty" style="padding:26px 16px;text-align:center">' +
      '<div style="font-size:34px;margin-bottom:8px">' + (NOTE_FILTER === 'trash' ? '🗑️' : NOTE_FILTER === 'arch' ? '📦' : '📝') + '</div>' +
      '<b style="font-size:14.5px">' + (kw || NOTE_TAG ? '没有匹配的便签' : NOTE_FILTER === 'trash' ? '回收站是空的' : NOTE_FILTER === 'arch' ? '还没有归档的便签' : '还没有便签') + '</b>' +
      (kw ? '<div class="xs mut2" style="margin-top:6px"><button class="btn sm" id="nNewKw">新建“' + esc(kw) + '”便签</button></div>' :
        '<div class="xs mut2" style="margin-top:5px;line-height:1.7">点右下角 ＋ 新建<br>支持标题、清单、图片、标签、提醒、归档</div>') +
      '</div>';
    var nk = $('#nNewKw');
    if (nk) nk.onclick = function () { noteEdit(null, { seed: kw }); };
  } else if (vm === 'list') {
    lw.innerHTML = '<div class="nlist">' + list.map(function (n) {
      var dn = noteDone(n), sel = NOTE_SEL && NOTE_SEL[n.id];
      return '<div class="nrow' + (sel ? ' on' : '') + '" data-id="' + n.id + '">' +
        '<span class="ndot" style="background:' + noteBg(n.color) + '"></span>' +
        '<span class="nmain">' +
        '<b class="nrt">' + (n.important ? '<span class="nstar">★</span>' : '') + (n.pin ? '📌' : '') + esc(noteTitle(n) || '无标题便签') + '</b>' +
        '<span class="nrs">' + esc(noteExcerpt(n, 40) || '（空）') + '</span>' +
        '</span>' +
        '<span class="nrmeta">' +
        (dn ? '<span class="nrb">' + dn + '</span>' : '') +
        (n.remind && n.remind.at ? '<span class="nrb r">⏰' + fmtMD(ds(new Date(n.remind.at))) + '</span>' : '') +
        '<span>' + fmtMD(ds(new Date(n.up || n.at))) + '</span>' +
        '</span></div>';
    }).join('') + '</div>';
  } else {
    lw.innerHTML = '<div class="ngrid">' + list.map(function (n) {
      var ex = n.lock ? '••••••••' : noteExcerpt(n, 44);
      var dn = noteDone(n), pct = 0;
      if (dn) { var ab = dn.split('/'); pct = ab[1] ? Math.round(+ab[0] / +ab[1] * 100) : 0; }
      var sel = NOTE_SEL && NOTE_SEL[n.id];
      return '<div class="ncard' + (sel ? ' on' : '') + '" data-id="' + n.id + '">' +
        '<span class="nbar" style="background:' + noteBg(n.color) + '"></span>' +
        '<div class="ncin">' +
        ((n.pin || n.important || n.lock) ? '<div class="nci">' +
          (n.pin ? '<span class="npin">📌</span>' : '') +
          (n.important ? '<span class="nimp">★</span>' : '') +
          (n.lock ? '<span class="nlock">🔒</span>' : '') + '</div>' : '') +
        '<b class="nct">' + esc(noteTitle(n) || '无标题便签') + '</b>' +
        '<span class="ntext">' + (esc(ex) || '<span class="mut2">（空便签）</span>') + '</span>' +
        (dn ? '<span class="nprog"><i style="width:' + pct + '%"></i></span><span class="nprogt">' + dn + '</span>' : '') +
        ((n.imgs && n.imgs[0]) ? '<img class="nthumb" src="' + n.imgs[0].d + '">' : '') +
        ((n.tags && n.tags.length) ? '<span class="ntags">' + n.tags.map(function (t) { return '#' + esc(t); }).join(' ') + '</span>' : '') +
        '<span class="nmeta">' +
        (n.remind && n.remind.at ? '<span class="nrm">⏰ ' + fmtMD(ds(new Date(n.remind.at))) + '</span>' : '') +
        ((n.imgs && n.imgs.length) ? '🖼' + n.imgs.length + ' · ' : '') +
        '<span class="nts">' + fmtMD(ds(new Date(n.up || n.at))) + '</span></span>' +
        '</div></div>';
    }).join('') + '</div>';
  }
  /* 关键词高亮 */
  if (kw) {
    $$('#nListWrap .ntext,#nListWrap .nct,#nListWrap .nrt,#nListWrap .nrs').forEach(function (el) {
      if ((el.innerHTML || '').indexOf('•••') >= 0) return;
      try {
        var re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
        el.innerHTML = el.innerHTML.replace(re, '<mark class="nk">$&</mark>');
      } catch (e) { }
    });
  }
  /* 点击 / 长按 */
  $$('#nListWrap .ncard,#nListWrap .nrow').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.id;
      if (NOTE_SEL) { if (NOTE_SEL[id]) delete NOTE_SEL[id]; else NOTE_SEL[id] = 1; drawNotes(); }
      else noteView(id);
    };
    if (!b.__lp && !NOTE_SEL) {
      b.__lp = 1;
      bindLongPress(b, function () {
        if (NOTE_SEL) return;
        var id = b.dataset.id;
        if (NOTE_FILTER === 'trash') trashMenu(id); else noteMenu(id);
      }, 520);
    }
  });
  /* FAB 在批量模式时隐藏 */
  var fb = $('#nFab');
  if (fb) fb.style.display = NOTE_SEL ? 'none' : '';
}

function drawNoteFilters() {
  var el = $('#nv'); if (!el) return;
  var c = noteCounts();
  var html = FILTERS.map(function (f) {
    var n = c[f[0]] || 0;
    return '<button data-f="' + f[0] + '"' + (NOTE_FILTER === f[0] ? ' class="on"' : '') + '>' + f[1] + ' ' + n + '</button>';
  }).join('');
  if (el.__html !== html) {
    el.innerHTML = html; el.__html = html;
    $$('#nv button').forEach(function (b) {
      b.onclick = function () { NOTE_FILTER = b.dataset.f; NOTE_SEL = null; drawNotes(); };
    });
  }
}
function drawNoteTags() {
  var el = $('#nTagsWrap'); if (!el) return;
  var tags = allNoteTags();
  var html = '';
  if (tags.length) {
    html = '<div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:8px">' +
      '<button class="tagpickb" data-t="" style="padding:3px 9px;border-radius:10px;font-size:11px;border:1px solid ' +
      (NOTE_TAG ? 'var(--line)' : 'var(--a1)') + ';background:' + (NOTE_TAG ? 'transparent' : 'color-mix(in srgb,var(--a1) 15%,transparent)') + ';color:var(--tx)">全部标签</button>' +
      tags.map(function (t) {
        var on = NOTE_TAG === t;
        return '<button class="tagpickb" data-t="' + esc(t) + '" style="padding:3px 9px;border-radius:10px;font-size:11px;border:1px solid ' +
          (on ? 'var(--a1)' : 'var(--line)') + ';background:' + (on ? 'color-mix(in srgb,var(--a1) 15%,transparent)' : 'transparent') + ';color:var(--tx)">#' + esc(t) + '</button>';
      }).join('') + '</div>';
  }
  if (el.__html !== html) {
    el.innerHTML = html; el.__html = html;
    $$('#nTagsWrap .tagpickb').forEach(function (b) {
      b.onclick = function () { NOTE_TAG = b.dataset.t || ''; drawNotes(); };
    });
  }
}
function drawNoteDyn() {
  var el = $('#nDynWrap'); if (!el) return;
  var h = '';
  if (NOTE_UNDO && NOTE_UNDO.length) {
    h += '<div class="row" style="gap:6px;margin-bottom:8px;padding:8px 10px;border-radius:12px;' +
      'background:color-mix(in srgb,var(--warn) 14%,var(--surf2));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)">' +
      '<span class="xs" style="flex:1">已删除 ' + NOTE_UNDO.length + ' 条</span>' +
      '<button class="btn sm" id="nUndo">撤销</button></div>';
  }
  el.innerHTML = h;
  var un = $('#nUndo');
  if (un) un.onclick = function () {
    (NOTE_UNDO || []).forEach(function (n) {
      S.notes = (S.notes || []).filter(function (x) { return x.id !== n.id; });
      n.del = 0; n.arch = 0;
      (S.notes = S.notes || []).push(n);
    });
    NOTE_UNDO = null; save(); drawNotes(); toast('已恢复');
  };
  /* 批量操作条：固定在 sheet 底部 */
  var f = $('#shFoot');
  if (!f) return;
  if (NOTE_SEL) {
    var c = Object.keys(NOTE_SEL).length;
    f.style.display = 'flex';
    f.className = 'sheet-f nbatch';
    f.innerHTML = '<button class="btn sm nbx" id="nbExit">✕ 退出多选</button>' +
      '<span class="xs" id="nbCnt">已选 ' + c + ' 条</span>' +
      '<button class="btn sm" id="nbAll">全选</button>' +
      '<button class="btn sm" id="nbPin">置顶</button>' +
      '<button class="btn sm" id="nbTag">标签</button>' +
      (NOTE_FILTER === 'trash' ? '<button class="btn sm" id="nbRe">恢复</button>'
        : '<button class="btn sm" id="nbAr">归档</button>') +
      '<button class="btn sm danger" id="nbDel">' + (NOTE_FILTER === 'trash' ? '彻底删' : '删除') + '</button>';
    var be = $('#nbExit');
    if (be) be.onclick = function () { NOTE_SEL = null; drawNotes(); };
    var ba = $('#nbAll');
    if (ba) ba.onclick = function () {
      var all = filterList(NOTE_FILTER);
      var on = Object.keys(NOTE_SEL).length < all.length;
      NOTE_SEL = {}; if (on) all.forEach(function (n) { NOTE_SEL[n.id] = 1; });
      drawNotes();
    };
    var bp = $('#nbPin');
    if (bp) bp.onclick = function () { batchNote(function (n) { n.pin = 1; }); };
    var bt = $('#nbTag');
    if (bt) bt.onclick = function () {
      var v = prompt('给选中的便签添加标签（空格分隔）');
      if (v == null) return;
      var arr = v.split(/[\s,，、]+/).filter(function (x) { return x; });
      if (!arr.length) return;
      batchNote(function (n) {
        n.tags = (n.tags || []).concat(arr.filter(function (t) { return (n.tags || []).indexOf(t) < 0; })).slice(0, 8);
      });
    };
    var br = $('#nbRe');
    if (br) br.onclick = function () { batchNote(function (n) { n.del = 0; n.arch = 0; }); };
    var bq = $('#nbAr');
    if (bq) bq.onclick = function () { batchNote(function (n) { n.arch = 1; n.pin = 0; }); };
    var bd = $('#nbDel');
    if (bd) bd.onclick = function () {
      var hard = NOTE_FILTER === 'trash';
      confirmBox(hard ? '彻底删除' : '删除便签', hard ? '彻底删除后无法恢复。' : '会放进回收站，可在回收站恢复。', function () {
        batchNote(function (n) {
          n.delAt = Date.now();
          if (hard) S.notes = (S.notes || []).filter(function (x) { return x.id !== n.id; });
          else { n.del = 1; n.pin = 0; }
        });
      }, hard ? '彻底删除' : '删除');
    };
  } else if (f.classList.contains('nbatch')) {
    f.style.display = 'none'; f.innerHTML = ''; f.className = 'sheet-f';
  }
}

/* ---------- 卡片长按菜单 ---------- */
function noteMenu(id) {
  var n = (S.notes || []).filter(function (x) { return x.id === id; })[0];
  if (!n) return; noteFix(n);
  var IT = [
    ['sel', '☑ 多选（批量操作）'],
    ['pin', n.pin ? '取消置顶' : '📌 置顶'],
    ['imp', n.important ? '☆ 取消重要' : '★ 标为重要'],
    ['remind', n.remind && n.remind.at ? '⏰ 改提醒' : '⏰ 设置提醒'],
    ['lock', n.lock ? '🔓 取消私密' : '🔒 设为私密'],
    ['folder', '🗂 分类：' + folderName(n.folder)],
    ['copy', '⧉ 复制一份'],
    ['dup', '📋 复制内容'],
    ['arch', n.arch ? '📤 取消归档' : '📦 归档'],
    ['del', '🗑 删除']
  ];
  openDlg({
    title: '便签操作', sub: (noteTitle(n) || '无标题').slice(0, 18), ok: false,
    body: '<div class="nmenu">' +
      IT.map(function (x) {
        return '<button class="nmb' + (x[0] === 'del' ? ' danger' : '') + '" data-a="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div>',
    onOpen: function () {
      $$('#dlgHost [data-a]').forEach(function (b) {
        b.onclick = function () {
          var a = b.dataset.a; closeDlg();
          setTimeout(function () {
            if (a === 'sel') {
              NOTE_SEL = {}; NOTE_SEL[id] = 1;
              drawNotes(); toast('已进入多选，可继续点选其它便签');
              return;
            }
            if (a === 'pin') { n.pin = n.pin ? 0 : 1; save(); toast(n.pin ? '已置顶' : '已取消'); }
            if (a === 'imp') { n.important = n.important ? 0 : 1; save(); toast(n.important ? '已标为重要' : '已取消重要'); }
            if (a === 'lock') { n.lock = n.lock ? 0 : 1; save(); toast(n.lock ? '已设为私密' : '已公开'); }
            if (a === 'remind') { setTimeout(function () { remindDlg(n, function () { save(); drawNotes(); }); }, 220); return; }
            if (a === 'folder') { setTimeout(function () { folderDlg(n, function () { save(); drawNotes(); }); }, 220); return; }
            if (a === 'copy') {
              var cp = JSON.parse(JSON.stringify(n));
              cp.id = uid(); cp.at = Date.now(); cp.up = Date.now(); cp.pin = 0; cp.del = 0; cp.arch = 0;
              (S.notes = S.notes || []).push(cp); save(); toast('已复制一份');
            }
            if (a === 'dup') { copy(noteText(n), '已复制内容'); return; }
            if (a === 'arch') { n.arch = n.arch ? 0 : 1; if (n.arch) n.pin = 0; save(); toast(n.arch ? '已归档' : '已取消归档'); }
            if (a === 'del') {
              confirmBox('删除便签', '会放进回收站，可恢复。', function () {
                NOTE_UNDO = [JSON.parse(JSON.stringify(n))];
                n.delAt = Date.now(); n.del = 1; n.pin = 0; save(); toast('已放入回收站');
              }, '删除');
              drawNotes(); return;
            }
            drawNotes();
          }, 180);
        };
      });
    }
  });
}
function trashMenu(id) {
  var n = (S.notes || []).filter(function (x) { return x.id === id; })[0];
  if (!n) return;
  openDlg({
    title: '回收站', sub: '要怎么处理这条？', ok: false,
    body: '<div style="display:flex;flex-direction:column;gap:7px">' +
      '<button class="btn wide" data-a="re">↩ 恢复</button>' +
      '<button class="btn wide danger" data-a="hard">🗑 彻底删除</button></div>',
    onOpen: function () {
      $$('#dlgHost [data-a]').forEach(function (b) {
        b.onclick = function () {
          var a = b.dataset.a; closeDlg();
          setTimeout(function () {

/* ---------- 提醒检查 ---------- */
var NOTE_TICK = null;
function checkReminders(silent) {
  var now = Date.now(), tk = today(), fired = [];
  (S.notes || []).forEach(function (n) {
    if (n.del || n.arch) return;
    var r = n.remind;
    if (!r || !r.at) return;
    var at = noteRemindAt(n);
    if (at > now) return;
    /* 免打扰：22:00-07:00 只记站内，不弹通知 */
    var hh = new Date().getHours();
    var quiet = hh >= 22 || hh < 7;
    if (r.repeat && r.repeat !== 'once') {
      if (r.lastDay === tk) return;
      r.lastDay = tk;
    } else {
      if (r.fired) return;
      r.fired = 1;
    }
    fired.push(n);
    if (!quiet) {
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          var nt = new Notification(noteTitle(n) || '便签提醒', {
            body: noteExcerpt(n, 60) || '（空便签）',
            tag: 'note-' + n.id
          });
          nt.onclick = function () { try { window.focus(); } catch (e) { } };
        }
      } catch (e) { }
    }
    if (!silent) showRemind(n);
  });
  if (fired.length) save();
  return fired;
}
function showRemind(n) {
  openDlg({
    title: '⏰ 提醒', sub: noteTitle(n) || '便签', ok: '知道了',
    body: '<div style="padding:10px 12px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);' +
      'font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto">' +
      esc(noteExcerpt(n, 200) || '（空便签）') + '</div>' +
      (n.remind && n.remind.at ? '<div class="xs mut2" style="margin-top:8px">提醒时间：' + remindText(n.remind) + '</div>' : ''),
    onOk: function () { }
  });
  try { chimeSoft(); } catch (e) { }
}
function startReminderTick() {
  if (NOTE_TICK) clearInterval(NOTE_TICK);
  NOTE_TICK = setInterval(function () { try { checkReminders(false); } catch (e) { } }, 30000);

/* ---------- 日历视图 ---------- */
function noteCalendar() {
  var cur = new Date(); cur.setDate(1); cur.setHours(0, 0, 0, 0);
  var MON = ['一', '二', '三', '四', '五', '六', '日'];
  openSheet('ncal', '便签日历', '', {
    back: function () { closeSheet(); setTimeout(notesSheet, 60); },
    onMount: drawCal,
    actions: '<button class="iconbtn" data-act="today">今天</button>',
    onAction: function (a) { if (a === 'today') { cur = new Date(); cur.setDate(1); cur.setHours(0, 0, 0, 0); drawCal(); } }
  });
  function drawCal() {
    var y = cur.getFullYear(), m = cur.getMonth();
    var first = new Date(y, m, 1);
    var wd = (first.getDay() + 6) % 7;   /* 周一=0 */
    var dim = new Date(y, m + 1, 0).getDate();
    /* 每天：便签数、提醒数 */
    var map = {};
    (S.notes || []).forEach(function (n) {
      if (n.del) return;
      var d = new Date(n.at); var k = ds(d).slice(0, 10);
      (map[k] = map[k] || { c: 0, r: 0 }).c++;
      if (n.remind && n.remind.at) {
        var k2 = ds(new Date(n.remind.at)).slice(0, 10);
        (map[k2] = map[k2] || { c: 0, r: 0 }).r++;
      }
    });
    var h = '<div class="row" style="gap:6px;align-items:center;margin-bottom:8px">' +
      '<button class="btn sm" id="cPrev">‹</button>' +
      '<b style="flex:1;text-align:center;font-size:15px">' + y + '年' + (m + 1) + '月</b>' +
      '<button class="btn sm" id="cNext">›</button></div>' +
      '<div class="calw">' + MON.map(function (x) { return '<span class="calh">' + x + '</span>'; }).join('') +
      Array(wd).fill('<span class="cald empty"></span>').join('');
    for (var i = 1; i <= dim; i++) {
      var key = y + '-' + pad(m + 1) + '-' + pad(i);
      var info = map[key] || { c: 0, r: 0 };
      var isT = key === today();
      h += '<span class="cald' + (isT ? ' today' : '') + (info.c || info.r ? ' has' : '') + '" data-d="' + key + '">' +
        '<b>' + i + '</b>' +
        ((info.c || info.r) ? '<i>' + (info.r ? '<em class="rd"></em>' : '') + (info.c ? '<em class="ct"></em>' : '') + '</i>' : '') +
        '</span>';
    }
    h += '</div>' +
      '<div class="row" style="gap:12px;margin-top:9px;font-size:11px;color:var(--tx3)">' +
      '<span><em class="lgd ct"></em> 有便签</span><span><em class="lgd rd"></em> 有提醒</span></div>' +
      '<div id="calList" style="margin-top:10px"></div>';
    $('#shBody').innerHTML = h;
    var pv = $('#cPrev'); if (pv) pv.onclick = function () { cur.setMonth(m - 1); drawCal(); };
    var nx = $('#cNext'); if (nx) nx.onclick = function () { cur.setMonth(m + 1); drawCal(); };
    $$('.cald[data-d]').forEach(function (el) {
      el.onclick = function () { calDay(el.dataset.d); };
    });
    calDay(today());
  }
  function calDay(key) {
    var box = $('#calList'); if (!box) return;
    var l = (S.notes || []).filter(function (n) {
      if (n.del) return false;
      return ds(new Date(n.at)).slice(0, 10) === key ||
        (n.remind && n.remind.at && ds(new Date(n.remind.at)).slice(0, 10) === key);
    });
    box.innerHTML = '<div class="ch" style="margin-bottom:6px"><h3>' + key + '（' + l.length + '）</h3></div>' +
      (l.length ? l.map(function (n) {
        return '<div class="nrow" data-id="' + n.id + '" style="margin-bottom:5px">' +
          '<span class="ndot" style="background:' + noteBg(n.color) + '"></span>' +
          '<span class="nmain"><b class="nrt">' + (n.important ? '★' : '') + esc(noteTitle(n) || '无标题') + '</b>' +
          '<span class="nrs">' + esc(noteExcerpt(n, 34) || '（空）') + '</span></span>' +
          '<span class="nrmeta">' + (n.remind && n.remind.at ? '<span class="nrb r">⏰' + pad(new Date(n.remind.at).getHours()) + ':' + pad(new Date(n.remind.at).getMinutes()) + '</span>' : '') + '</span></div>';
      }).join('') : '<div class="hint">这天没有便签</div>');
    $$('#calList .nrow').forEach(function (el) {
      el.onclick = function () { noteView(el.dataset.id); };
    });
  }
}

/* 导入 Markdown */
function importMd(file) {

var SWIPE_OPEN = null;      /* 当前滑开的卡片 */
function closeSwipe(except) {
  if (SWIPE_OPEN && SWIPE_OPEN !== except) {
    var el = SWIPE_OPEN.el;
    try { el.style.transform = ''; el.classList.remove('swiping', 'swopen'); } catch (e) { }

    var p = pt(e);

      if (Math.abs(mx) > 8) { locked = 1; el.classList.add('swiping'); }
    }

    } else {
      el.style.transform = '';

    }

/* ---------- 1. 打开任何弹层时清掉上一个页面留下的类 ----------

   都被 overflow:hidden 锁死，内容超出也滚不动。 */
(function () {
  var _os = openSheet;
  openSheet = function (id, title, body, opts) {
    var b = $('#shBody');
    if (b) {
      b.classList.remove('nedit', 'nvfull');
      b.style.position = '';
      b.style.opacity = '';
      b.style.transform = '';
      b.style.transition = '';
      b.style.webkitTransform = '';
    }
    var hd = document.querySelector('.sheet-h');
    if (hd) hd.classList.remove('thin');
    var r = _os.apply(this, arguments);

    if (id === 'noteedit') {
      setTimeout(function () { if (window.mountTb) mountTb(); }, 20);

})();

/* ========== 习惯应用重做（数据清晰 + 一键打卡 + 热力图） ========== */

/* ---------- 计算辅助：连续天数（口径明确） ---------- */
/* 单个习惯「当前连续」：今天完成才算；今天没完成则从昨天往前数（避免一过零点就断） */
function habitStreakCur(h) {
  var n = 0, k = today();
  if (!habitDoneOn(h, k)) k = addDays(k, -1);
  while (habitDoneOn(h, k)) { n++; k = addDays(k, -1); }
  return n;
}
/* 「全员连续」：所有习惯当天都完成才算一天 */
function habitAllStreak() {
  if (!S.habits.length) return 0;
  var allDone = function (kk) {
    return S.habits.every(function (h) { return habitDoneOn(h, kk); });
  };
  var n = 0, k = today();
  if (!allDone(k)) k = addDays(k, -1);
  while (allDone(k)) { n++; k = addDays(k, -1); }
  return n;
}
/* 近 N 天完成率（口径统一：完成次数 / 应完成次数） */
function habitRate(days) {
  var tot = 0, ok = 0;
  for (var j = 0; j < days; j++) {
    var k = addDays(today(), -j);
    S.habits.forEach(function (h) {
      tot++;
      if (habitDoneOn(h, k)) ok++;
    });
  }
  return tot ? Math.round(ok / tot * 100) : 0;
}
/* 某天完成了几个 */
function habitDayDone(k) {
  return S.habits.filter(function (h) { return habitDoneOn(h, k); }).length;
}

/* ---------- 主渲染 ---------- */
function drawHabit() {
  var tdy = today(), isToday = (CUR === tdy);
  var total = S.habits.length;
  var doneN = habitDayDone(CUR);
  var dayAch = S.habits.reduce(function (a, h) {
    return a + (habitAchDay(h, CUR) ? habitAchOf(h) : 0);
  }, 0);
  var html = '<div id="hDays"></div>' + pastWarn();

  /* 1) 今日进度：大数字 + 进度环，一眼看清 */
  var pct = total ? Math.round(doneN / total * 100) : 0;
  var curStreak = habitAllStreak();
  html += '<div class="card hToday" style="margin-bottom:10px">' +
    '<div class="htop">' +
    '<div class="hring' + (pct >= 100 ? ' full' : '') + '">' +
    '<svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/>' +
    '<circle class="fg" cx="22" cy="22" r="19" style="stroke-dashoffset:' +
    (119.4 - 119.4 * pct / 100) + '"/></svg>' +
    '<span class="hnum">' + doneN + '<i>/' + total + '</i></span></div>' +
    '<div class="hinfo">' +
    '<b class="htitle">' + (pct >= 100 ? '今天全部完成 🎉' : '今天完成 ' + doneN + ' / ' + total + ' 个') + '</b>' +
    '<span class="xs mut2">' + relLabel(CUR) + (isToday ? '' : ' · 补打卡中') + '</span>' +
    '<div class="hsub">' +
    '<span class="tag" style="color:var(--ach);border-color:color-mix(in srgb,var(--ach) 40%,transparent)" title="今天新达成的习惯成就">今日新增 ' + r1(dayAch) + '</span>' +
    '<span class="tag" style="color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)">≈ ¥' + money(achToMoney(dayAch)) + '</span>' +
    '</div></div></div>' +
    (total ? '<button class="btn wide" id="hAll" style="margin-top:10px">' +
      (pct >= 100 ? '取消全部完成' : '✅ 一键全部完成') + '</button>' : '') +
    '</div>';

  /* 2) 习惯列表：大图标可点 = 一键打卡 */
  if (!total) {
    html += '<div class="card" style="margin-bottom:10px"><div class="empty">还没有习惯<br>点下面「添加新习惯」，从一个微小的坚持开始</div></div>';
  } else {
    html += '<div class="card" style="margin-bottom:10px"><div class="ch"><h3>我的习惯</h3>' +
      '<span class="sp xs mut2">点图标打卡 · 点圆点记次数</span></div>';
    html += S.habits.map(function (h) {
      var times = habitTimes(h), pc = Math.min(hPeriodCount(h, CUR), times), ok = habitDoneOn(h, CUR);
      var sc = habitStreakCur(h), bs = habitBest(h.id);
      /* 次数圆点（多次习惯才显示） */
      var dots = '';
      if (times > 1) {
        for (var i = 0; i < times; i++) {
          dots += '<button class="hdot' + (i < pc ? ' on' : '') + '" data-hb="' + h.id + '" data-i="' + i + '"></button>';
        }
      }
      return '<div class="hitem' + (ok ? ' ok' : '') + '">' +
        /* 左侧：大图标 = 一键打卡 */
        '<button class="htap' + (ok ? ' on' : '') + '" data-ht="' + h.id + '" title="点一下打卡">' +
        '<span class="hico">' + (h.icon || '✓') + '</span>' +
        (ok ? '<span class="hchk">✓</span>' : '') + '</button>' +
        '<div class="hmid">' +
        '<b class="hname">' + esc(h.name) + '</b>' +
        '<span class="xs mut2">' + (h.freq === 'week' ? '每周' : h.freq === 'month' ? '每月' : '每天') +
        ' ' + times + ' 次 · 成就 +' + r1(habitAchOf(h)) + '</span>' +
        (times > 1 ? '<div class="hdots">' + dots +
          '<span class="xs mut2" style="margin-left:5px">' + pc + '/' + times + '</span></div>' : '') +
        '</div>' +
        '<div class="hright">' +
        '<span class="hfire">' + (sc > 0 ? '🔥 ' + sc + ' 天' : '—') + '</span>' +
        '<span class="xs mut2">最佳 ' + bs + ' 天</span>' +
        '<span class="hact"><button class="iconbtn" data-ed="' + h.id + '">' + ICO_ED + '</button>' +
        '<button class="iconbtn" data-hd2="' + h.id + '">' + ICO_DEL + '</button></span>' +
        '</div></div>';
    }).join('');
    html += '</div>';
  }

  /* 3) 热力图：近 12 周贡献网格（主视觉） */
  if (total) {
    var WEEKS = 12, endK = tdy;
    var startK = addDays(endK, -(WEEKS * 7 - 1));
    var gridStart = weekRange(startK)[0];      // 对齐到周一
    var cells = '', kd = gridStart, guard = 0;
    while (kd <= endK && guard < 200) {
      var dn = habitDayDone(kd), r = total ? dn / total : 0;
      var lv = dn === 0 ? 0 : r >= 1 ? 4 : r >= 0.7 ? 3 : r >= 0.4 ? 2 : 1;
      cells += '<i class="hcell lv' + lv + (kd === tdy ? ' td' : '') + '" data-d="' + kd + '" ' +
        'title="' + kd + '：' + dn + '/' + total + '"></i>';
      kd = addDays(kd, 1); guard++;
    }
    var legend = '<div class="hlegend"><span class="xs mut2">少</span>' +
      ['lv0', 'lv1', 'lv2', 'lv3', 'lv4'].map(function (c) {
        return '<i class="hcell ' + c + '"></i>';
      }).join('') + '<span class="xs mut2">多</span></div>';
    html += '<div class="card" style="margin-bottom:10px"><div class="ch"><h3>坚持轨迹</h3>' +
      '<span class="sp xs mut2">近 12 周 · 点格子可切到那天补卡</span></div>' +
      '<div class="hgrid">' + cells + '</div>' + legend + '</div>';
  }

  /* 4) 统计：口径统一，四个格子 */
  if (total) {
    html += '<div class="card" style="margin-bottom:10px"><div class="ch"><h3>数据一览</h3></div>' +
      '<div class="hstat5">' +
      '<div><b>' + doneN + '<i>/' + total + '</i></b><span>今日</span></div>' +
      '<div><b>' + habitRate(7) + '<i>%</i></b><span>近 7 天</span></div>' +
      '<div><b>' + habitRate(30) + '<i>%</i></b><span>近 30 天</span></div>' +
      '<div><b>' + curStreak + '<i>天</i></b><span>全员连续</span></div>' +
      '<div><b>' + habitBestAll() + '<i>天</i></b><span>最长全员</span></div>' +
      '</div></div>';
  }

  /* 5) 最近记录（折叠，默认收起，避免一长串文字刷屏） */
  if (total) {
    var ROW = 10, list = [];
    allDays().slice().reverse().slice(0, ROW).forEach(function (k) {
      var ok2 = S.habits.filter(function (h) { return habitDoneOn(h, k); });
      var a2 = S.habits.reduce(function (a, h) { return a + (habitAchDay(h, k) ? habitAchOf(h) : 0); }, 0);
      if (!ok2.length && !a2) return;
      list.push('<div class="hrec"><span class="hdate">' + relLabel(k) + '</span>' +
        '<span class="hnames">' + (ok2.length ? ok2.map(function (h) { return (h.icon || '') + esc(h.name); }).join(' ') : '未打卡') + '</span>' +
        '<span class="hplus">+' + r1(a2) + '</span></div>');
    });
    html += '<div class="card"><div class="ch"><h3>最近记录</h3><span class="sp">' +
      '<button class="mini" id="hkChart">对比图</button><button class="mini" id="hkCopy">复制</button></span></div>' +
      (list.length ? '<div class="hrecs">' + list.join('') + '</div>' : '<div class="empty">还没有记录</div>') +
      '</div>';
  }

  $('#shBody').innerHTML = html;
  dateBar('hDays', drawHabit);

  /* 一键全部完成 */
  var ha = $('#hAll');
  if (ha) ha.onclick = function () {
    guardPast(function () {
      var full = (habitDayDone(CUR) >= S.habits.length);
      S.habits.forEach(function (h) {
        var x = getDay(CUR, true);
        if (full) delete x.habits[h.id]; else x.habits[h.id] = habitTimes(h);
      });
      save(); drawHabit(); if (!full) chimeSoft();
      toast(full ? '已取消全部完成' : '今天全部完成，厉害');
    }, '确认修改 ' + fmtMD(CUR) + ' 的打卡记录？');
  };

  /* 点大图标 = 一键打卡 / 取消 */
  $$('#shBody [data-ht]').forEach(function (b) {
    b.onclick = function () {
      var h = S.habits.filter(function (x) { return x.id === b.dataset.ht; })[0]; if (!h) return;
      var on = habitDoneOn(h, CUR);
      guardPast(function () {
        var x = getDay(CUR, true);
        if (on) delete x.habits[h.id]; else x.habits[h.id] = habitTimes(h);
        save(); drawHabit(); if (!on) chimeSoft();
        toast(on ? '已取消「' + h.name + '」' : '「' + h.name + '」已完成');
      }, '确认修改 ' + fmtMD(CUR) + ' 的打卡记录？');
    };
  });

  /* 次数圆点 */
  $$('#shBody [data-hb]').forEach(function (b) {
    b.onclick = function () {
      var h = S.habits.filter(function (x) { return x.id === b.dataset.hb; })[0]; if (!h) return;
      var i = +b.dataset.i, times = habitTimes(h), pc = Math.min(hPeriodCount(h, CUR), times);
      var want = (i + 1 === pc) ? i : i + 1;   // 点最后一个已完成 → 减一
      guardPast(function () {
        var x = getDay(CUR, true);
        if (want <= 0) delete x.habits[h.id]; else x.habits[h.id] = want;
        save(); drawHabit(); if (want > 0) chimeSoft();
      }, '确认修改 ' + fmtMD(CUR) + ' 的打卡记录？');
    };
  });

  /* 编辑 / 删除 */
  $$('#shBody [data-ed]').forEach(function (b) { b.onclick = function () { habitDlg(b.dataset.ed); }; });
  $$('#shBody [data-hd2]').forEach(function (b) {
    b.onclick = function () {
      var h = S.habits.filter(function (x) { return x.id === b.dataset.hd2; })[0]; if (!h) return;
      confirmBox('删除习惯「' + h.name + '」', '打卡记录会一起删掉', function () {
        S.habits = S.habits.filter(function (x) { return x.id !== h.id; });
        Object.keys(S.days).forEach(function (k) { if (S.days[k].habits) delete S.days[k].habits[h.id]; });
        save(); drawHabit(); toast('已删除');
      }, '删除');
    };
  });

  /* 热力图点格子 → 切到那天 */
  $$('#shBody .hcell[data-d]').forEach(function (c) {
    c.onclick = function () {
      var k = c.dataset.d;
      if (k > today()) { toast('还没到那一天'); return; }
      setCur(k, true); drawHabit();
      toast('已切到 ' + fmtMD(k) + '，可以补打卡');
    };
  });

  var hc = $('#hkChart');
  if (hc) hc.onclick = function () {
    chartDlg({
      title: '习惯完成数对比', unit: ' 个', color: 'var(--ok)', gran: 'd', range: 30, agg: 'sum',
      sub: '每天完成了几个习惯', fn: function (k) { return habitDayDone(k); }
    });
  };
  var kc = $('#hkCopy');
  if (kc) kc.onclick = function () {
    var L = ['【习惯记录】'];
    allDays().slice().reverse().slice(0, 60).forEach(function (k) {
      var ds2 = S.habits.filter(function (h) { return habitDoneOn(h, k); }).map(function (h) { return h.name; });
      L.push(relLabel(k) + '　' + (ds2.length ? ds2.join('、') : '未打卡'));
    });

/* 最长「全员连续」天数 */
function habitBestAll() {
  if (!S.habits.length) return 0;
  var keys = allDays().slice().sort();
  var best = 0, cur = 0, prev = null;
  keys.forEach(function (k) {
    var allOk = S.habits.every(function (h) { return habitDoneOn(h, k); });
    if (allOk) { cur = (prev && dayDiff(k, prev) === 1) ? cur + 1 : 1; best = Math.max(best, cur); }
    else cur = 0;
    prev = k;
  });
  return best;
}

  function hIsBad(h) { return h && h.type === 'bad'; }
  function hFreq(h) { return (h && h.freq) || 'day'; }
  function hPDays(h, k) {
    var f = hFreq(h);
    if (f === 'week') { try { return weekRange(k); } catch (e) { return [k, k]; } }
    if (f === 'month') { try { return monthRange(k); } catch (e) { return [k, k]; } }
    return [k, k];
  }
  function hPTotal(h, k) {
    var r = hPDays(h, k), t = 0, x = r[0], g = 0;
    while (x <= r[1] && g++ < 400) { t += hCount(h, x); x = addDays(x, 1); }
    return t;
  }
  /* 某天归属到该习惯的积分（周期奖励/扣分均摊到周期内每天） */
  function habitDayPts(h, k) {
    if (!h) return 0;
    var c = hCount(h, k), f = hFreq(h), tgt = num(h.times, 1);
    var a = num(h.a, num(h.ach, 5));
    var b = num(h.b, 0), cc = num(h.c, 0), dd = num(h.d, 0);
    if (hIsBad(h)) {
      var base = num(h.base, num(h.ach, 0)), ov = num(h.over, 0), un = num(h.under, 0);
      var r0 = hPDays(h, k), len0 = Math.max(1, dayDiff(r0[1], r0[0]) + 1), tot0 = hPTotal(h, k);
      var ex = Math.max(0, tot0 - tgt), sh = Math.max(0, tgt - tot0);
      return (base - ov * ex + un * sh) / len0;
    }
    if (f === 'day') {
      var p = c * a;
      if (c >= tgt) p += b + (c - tgt) * dd; else p -= (tgt - c) * cc;
      return p;
    }
    var r = hPDays(h, k), len = Math.max(1, dayDiff(r[1], r[0]) + 1), tot = hPTotal(h, k);
    var adj = tot >= tgt ? (b + (tot - tgt) * dd) : (-(tgt - tot) * cc);
    return c * a + adj / len;

  function evTime(e) { return (e.date || '') + ' ' + (e.time || '00:00'); }

    if (hh > 0) return hh + ' 小时 ' + mm + ' 分';
    if (mm > 0) return mm + ' 分钟';
    return s > 0 ? s + ' 秒' : '已到';

<!-- PWA：Service Worker + 安装入口 -->
<script>
(function () {
  try {
    var proto = location.protocol;
    if (proto !== 'https:' && proto !== 'http:') return;      // file:// 直接跳过
    if (!('serviceWorker' in navigator)) return;

    /* 记录安装事件，稍后在「我的」页给出「安装到桌面」按钮 */
    window.__LUMEN_DEFERRED__ = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__LUMEN_DEFERRED__ = e;
      showInstallCard();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function (reg) {
          window.__LUMEN_SW__ = reg;
          if (reg.waiting) window.__LUMEN_UPDATE__ = true;
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed') {
                window.__LUMEN_UPDATE__ = true;
                try { if (window.toast) window.toast('有新版本，下次打开生效'); } catch (e) { }
              }
            });
          });
        })
        .catch(function (err) {
          /* 注册失败静默处理，绝不影响主功能 */
          try { console.warn('SW 注册失败', err); } catch (e) { }
        });
    });

    /* 在「我的」页顶部插入「安装到桌面」卡片（仅当浏览器支持安装时） */
    function showInstallCard() {
      var tryInsert = function () {
        var page = document.getElementById('p-mine');
        if (!page) { setTimeout(tryInsert, 700); return; }
        if (document.getElementById('lumenInstallCard')) return;
        var card = document.createElement('div');
        card.id = 'lumenInstallCard';
        card.className = 'card';
        card.style.cssText = 'margin-bottom:10px;border-color:var(--a1);' +
          'background:color-mix(in srgb,var(--a1) 10%,var(--surf))';
        card.innerHTML = '<div class="ch"><h3>安装到桌面</h3></div>' +
          '<div class="xs mut2" style="margin-bottom:8px">' +
          '装成独立应用：全屏显示、无地址栏、断网也能用</div>' +
          '<button class="btn primary wide" id="lumenInstallBtn">立即安装</button>';
        page.insertBefore(card, page.firstChild);
        var b = document.getElementById('lumenInstallBtn');
        if (b) b.onclick = function () {
          var e = window.__LUMEN_DEFERRED__;
          if (!e) { try { window.toast && window.toast('请在浏览器菜单里选「安装应用」'); } catch (x) { } return; }
          e.prompt();
          e.userChoice.then(function (r) {
            if (r && r.outcome === 'accepted') {
              try { card.parentNode.removeChild(card); } catch (x) { }
            }
            window.__LUMEN_DEFERRED__ = null;
          });
        };
      };
      setTimeout(tryInsert, 600);
    }
    /* 页面里可能已支持安装（比如重装场景），也尝试一次 */
    setTimeout(showInstallCard, 1500);
  } catch (e) { }
})();
</script>
