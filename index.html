<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B0C11">
<meta name="color-scheme" content="dark light">
<title>晨昏 LUMEN</title>
<style>
/* ================= 设计令牌 ================= */
:root{
  --bg:#0B0C11; --surf:#15171F; --surf2:#1C1F29; --surf3:#242834;
  --line:rgba(255,255,255,.34); --line-s:rgba(255,255,255,.58);
  --tx:#F4F6FA; --tx2:#BCC1D2; --tx3:#9298AB;
  --a1:#8B6BFF; --a2:#33E8C8;
  --ok:#4ADE80; --warn:#FBBF24; --danger:#FB6B81; --info:#60A5FA;
  --solid:#171A23;
  --r:20px; --rs:14px;
  --fs:15px;
  --tabh:60px;
}
html[data-theme="light"]{
  --bg:#E9EDF3; --surf:#FFFFFF; --surf2:#F2F4F9; --surf3:#E2E7F0;
  --line:rgba(14,18,32,.42); --line-s:rgba(14,18,32,.66);
  --tx:#0E1117; --tx2:#4A4F60; --tx3:#6B7183;
  --a1:#6D3EF0; --a2:#0E9384;
  --ok:#12924F; --warn:#B87400; --danger:#D63A56; --info:#1D6FD8;
  --solid:#FFFFFF;
}
/* 柔和（第三种）：浅色养眼 + 深色不刺眼 —— 偏暖的浅灰蓝底，卡片更亮，
   边框清晰但不生硬，整体低刺激，长时间看最舒服 */
html[data-theme="dusk"]{
  --bg:#DDE3EC; --surf:#F7F9FC; --surf2:#EDF1F7; --surf3:#E2E8F2;
  --line:rgba(28,44,72,.30); --line-s:rgba(28,44,72,.52);
  --tx:#1B2432; --tx2:#4C5A6E; --tx3:#75839A;
  --a1:#2F6FD0; --a2:#128A72;
  --ok:#1F8A52; --warn:#9A6200; --danger:#C63A44; --info:#2C6BB0;
  --solid:#F7F9FC;
}
html[data-fs="s"]{--fs:14px}
html[data-fs="m"]{--fs:15px}
html[data-fs="l"]{--fs:16.5px}
html[data-fs="xl"]{--fs:18px}
html[data-accent="violet"]{--a1:#8B6BFF;--a2:#33E8C8}
html[data-theme="light"][data-accent="violet"]{--a1:#6D3EF0;--a2:#0E9384}
html[data-accent="douyin"]{--a1:#FE2C55;--a2:#25F4EE}
html[data-theme="light"][data-accent="douyin"]{--a1:#E01338;--a2:#0A93A0}
html[data-accent="sunset"]{--a1:#FF7847;--a2:#FFC44D}
html[data-theme="light"][data-accent="sunset"]{--a1:#D64A16;--a2:#A97000}
html[data-accent="ocean"]{--a1:#4C8DFF;--a2:#5EEAD4}
html[data-theme="light"][data-accent="ocean"]{--a1:#1D6FD8;--a2:#0E9384}
html[data-accent="sakura"]{--a1:#FF62AD;--a2:#A78BFA}
html[data-theme="light"][data-accent="sakura"]{--a1:#D62179;--a2:#6B32D6}
html[data-accent="forest"]{--a1:#4ADE80;--a2:#7DD3FC}
html[data-theme="dusk"][data-accent="violet"]{--a1:#7B4BC9;--a2:#2F7D6E}
html[data-theme="dusk"][data-accent="douyin"]{--a1:#C81F3F;--a2:#0E7C86}
html[data-theme="dusk"][data-accent="sunset"]{--a1:#B0602C;--a2:#8A6300}
html[data-theme="dusk"][data-accent="ocean"]{--a1:#2569B8;--a2:#2F7D6E}
html[data-theme="dusk"][data-accent="sakura"]{--a1:#B02A62;--a2:#6B45B8}
html[data-theme="dusk"][data-accent="forest"]{--a1:#3E7A46;--a2:#2569B8}
html[data-theme="light"][data-accent="forest"]{--a1:#12924F;--a2:#1D6FD8}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--tx);font-size:var(--fs);line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{background:none;border:0;outline:0}
::selection{background:color-mix(in srgb,var(--a1) 45%,transparent);color:#fff}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--tx2)}.mut2{color:var(--tx3)}
.sm{font-size:12.5px}.xs{font-size:11.5px}

/* ================= 手机壳 ================= */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4}
.orb.a{width:60vw;height:60vw;left:-15vw;top:-14vh;background:radial-gradient(circle,var(--a1),transparent 68%);animation:fl1 30s ease-in-out infinite}
.orb.b{width:52vw;height:52vw;right:-14vw;top:18vh;background:radial-gradient(circle,var(--a2),transparent 68%);opacity:.24;animation:fl2 38s ease-in-out infinite}
.orb.c{width:56vw;height:56vw;left:10vw;bottom:-20vh;background:radial-gradient(circle,var(--a1),transparent 70%);opacity:.16;animation:fl2 44s ease-in-out infinite reverse}
@keyframes fl1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.08)}}
@keyframes fl2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-5vw,7vh,0) scale(.92)}}
html[data-theme="light"] .orb{opacity:.13}

.phone{
  position:relative;z-index:1;width:100%;max-width:440px;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
}
@media(min-height:700px) and (min-width:760px){
  body{padding:18px 0}
  .phone{height:min(880px,calc(100dvh - 36px));border-radius:34px;border:1px solid var(--line);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.6);overflow:hidden}
  html[data-theme="light"] .phone{box-shadow:0 30px 70px -34px rgba(20,30,60,.35)}
}

.pages{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding:0 16px;overflow:hidden}
.page.on{display:flex;animation:pin .34s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:center;gap:10px;padding:14px 0 8px;flex:0 0 auto}
.phead h1{margin:0;font-size:20px;font-weight:680;letter-spacing:-.025em}
.phead .sp{margin-left:auto;display:flex;gap:7px}

/* 通用块 */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tight{padding:11px 13px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.ch h3::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(var(--a1),var(--a2))}
.ch .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.sep{height:1px;background:var(--line);margin:12px 0}

.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);
  color:var(--tx);font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.2s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn.primary{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a2) 50%,var(--a1)));border-color:color-mix(in srgb,var(--a1) 60%,transparent);color:#fff;font-weight:680;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 8px 22px -12px color-mix(in srgb,var(--a1) 90%,transparent)}
.btn.primary:active{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.lg{height:50px;font-size:15.5px;border-radius:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.mini{height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);color:var(--tx2);font-size:12.5px;font-weight:570;transition:.18s;white-space:nowrap}
.mini:active{transform:scale(.95)}
.mini.on{background:color-mix(in srgb,var(--a1) 18%,transparent);border-color:color-mix(in srgb,var(--a1) 48%,transparent);color:var(--tx);font-weight:640}
.mini.dg{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 34%,transparent)}
.iconbtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--tx3);transition:.18s;flex:0 0 auto}
.iconbtn:active{background:var(--surf2);color:var(--tx)}
.iconbtn svg{width:18px;height:18px}
.inp{width:100%;height:44px;padding:0 13px;border-radius:13px;border:1px solid var(--line);background:var(--surf2);color:var(--tx);font-size:15px;transition:.18s}
.inp::placeholder{color:var(--tx3)}
.inp:focus{border-color:color-mix(in srgb,var(--a1) 62%,transparent);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--a1) 13%,transparent)}
textarea.inp{height:auto;padding:11px 13px;line-height:1.7;resize:none;font-family:inherit}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:12.5px;color:var(--tx2);font-weight:600}
.hint{font-size:12px;color:var(--tx3);line-height:1.6}
.row{display:flex;gap:9px;align-items:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:640;background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx2)}
.tag.a{background:color-mix(in srgb,var(--a1) 16%,transparent);color:color-mix(in srgb,var(--a1) 80%,var(--tx))}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.dg{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:22px 12px;line-height:1.8}
.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:var(--line-s);border-radius:99px}

/* ================= 主页 ================= */
.hi-greet{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hi-greet b{font-size:17px;font-weight:680}
.clock{display:flex;align-items:baseline;gap:4px;line-height:1;margin:2px 0}
.clock .h{font-size:52px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.clock .s{font-size:19px;font-weight:600;color:var(--a2);font-variant-numeric:tabular-nums}
.clock .ap{font-size:12px;font-weight:640;color:var(--tx2);margin-left:3px}
.hclk{font-size:44px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.hclk-s{font-size:16px;font-weight:600;color:var(--a2);font-variant-numeric:tabular-nums}
.hclk-ap{font-size:11px;font-weight:640;color:var(--tx2);margin-left:3px}
#hRm .rmitem{flex:1;min-height:0;align-items:center;overflow:hidden}
#hRm .rmitem b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hRm .rmitem small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-wx{display:flex;align-items:center;gap:12px}
.hi-wx .ico{width:46px;height:46px;flex:0 0 auto;color:var(--a2)}
.hi-wx .ico.sun{color:#FFC24B}.hi-wx .ico.rain{color:#5AA9F5}.hi-wx .ico.snow{color:#A8DCFF}
.hi-wx .ico.thunder{color:#B08CFF}.hi-wx .ico.cloud{color:var(--tx2)}.hi-wx .ico.fog{color:var(--tx3)}
.hi-wx .t{font-size:30px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.hi-alert{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:13px;margin-top:10px;
  background:color-mix(in srgb,var(--danger) 15%,transparent);border:1px solid color-mix(in srgb,var(--danger) 36%,transparent);font-size:13px}
.hi-alert svg{width:17px;height:17px;color:var(--danger);flex:0 0 auto}
.hi-alert b{color:var(--danger)}
.hi-alert.i2{background:color-mix(in srgb,var(--info) 14%,transparent);border-color:color-mix(in srgb,var(--info) 32%,transparent)}
.hi-alert.i2 svg{color:var(--info)}
.hi-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hi-tiles button{text-align:center;padding:10px 4px;border-radius:15px;background:var(--surf2);border:1px solid transparent;transition:.2s}
.hi-tiles button:active{transform:scale(.96)}
.hi-tiles .k{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px}
.hi-tiles .v{display:block;font-size:17px;font-weight:670;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hi-tiles .s{display:block;font-size:10.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmlist{display:flex;flex-direction:column;gap:7px}
.rmitem{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:13px;background:var(--surf2);border:1px solid transparent;font-size:13px;text-align:left;width:100%}
.rmitem.dg{background:color-mix(in srgb,var(--danger) 12%,var(--surf2));border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.rmitem.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surf2));border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.rmitem b{font-weight:620;display:block;line-height:1.4}
.rmitem small{color:var(--tx2);font-size:11.5px;display:block;margin-top:1px;line-height:1.45}
.ybar-t{height:7px;border-radius:99px;background:color-mix(in srgb,var(--tx) 9%,transparent);overflow:hidden;margin-top:6px}
.ybar-t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* ================= 应用页 ================= */
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;transition:.2s;position:relative}
.app:active{transform:scale(.93)}
.app .ic{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.7);transition:.2s}
html[data-theme="light"] .app .ic{box-shadow:0 5px 14px -8px rgba(20,30,60,.4)}
.app .ic svg{width:26px;height:26px;color:#fff}
.app span{font-size:11.5px;color:var(--tx2);font-weight:560;text-align:center;line-height:1.25;max-width:64px}
.app .dot{position:absolute;top:-2px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.app.pick .ic{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.app .x{position:absolute;top:-4px;left:-2px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
.app .add{position:absolute;inset:0;border-radius:17px;border:1.5px dashed var(--line-s);display:grid;place-items:center}

/* ================= 数据页 ================= */
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:0 0 auto}
.chiprow::-webkit-scrollbar{display:none}
.chartbox{flex:1;min-height:120px;position:relative;margin:6px 0 2px}
.chartbox svg{width:100%;height:100%;display:block;overflow:hidden}
.dstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:0 0 auto}
.dstat div{background:var(--surf2);border-radius:14px;padding:9px 6px;text-align:center}
.dstat span{display:block;font-size:10.5px;color:var(--tx2);margin-bottom:2px}
.dstat b{display:block;font-size:16px;font-weight:670;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ================= 我的 ================= */
.profile{display:flex;align-items:center;gap:13px}
.avatar{width:66px;height:66px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 30%,transparent),color-mix(in srgb,var(--a2) 26%,transparent));border:1px solid var(--line-s);flex:0 0 auto}
.pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pstat div{background:var(--surf2);border-radius:13px;padding:8px 4px;text-align:center}
.pstat b{display:block;font-size:17px;font-weight:670}
.pstat span{display:block;font-size:10.5px;color:var(--tx2)}
.msetgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:7px}
.mset{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--surf2);border-radius:15px;border:1px solid transparent;transition:.18s;padding:6px 3px;min-height:0;overflow:hidden}
.mset:active{transform:scale(.96);background:var(--surf3)}
.mset .msi{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 16%,transparent);flex:0 0 auto}
.mset .msi svg{width:16px;height:16px;color:var(--a2)}
.mset b{font-size:13px;font-weight:640}
.mset small{font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.setlist{display:flex;flex-direction:column;gap:7px}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;background:var(--surf2);border:1px solid transparent;transition:.18s;width:100%;text-align:left}
.setrow:active{background:var(--surf3)}
.setrow .si{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--a1) 15%,transparent)}
.setrow .si svg{width:17px;height:17px;color:var(--a2)}
.setrow .st{flex:1;min-width:0}
.setrow .st b{display:block;font-size:14.5px;font-weight:600}
.setrow .st small{display:block;font-size:11.5px;color:var(--tx2);margin-top:1px}
.setrow .sv{font-size:13px;color:var(--tx2);flex:0 0 auto;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .ar{color:var(--tx3);flex:0 0 auto}
.setrow .ar svg{width:16px;height:16px}
.switch{width:46px;height:27px;border-radius:99px;background:color-mix(in srgb,var(--tx) 17%,transparent);position:relative;transition:.28s;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--tx);transition:.28s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.switch.on::after{left:22px;background:#fff}
.accent-pick{display:flex;gap:9px;flex-wrap:wrap}
.accent-pick button{width:34px;height:34px;border-radius:11px;transition:.22s;border:2px solid transparent}
.accent-pick button.on{border-color:var(--tx);transform:scale(1.1)}
.segline{display:flex;gap:6px;flex-wrap:wrap}
.segline button{height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--line);font-size:13px;color:var(--tx2);transition:.18s;background:var(--surf)}
.segline button.on{background:color-mix(in srgb,var(--a1) 16%,transparent);border-color:color-mix(in srgb,var(--a1) 44%,transparent);color:var(--tx);font-weight:640}
.segline.sm button{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px}
.ranger{display:flex;align-items:center;gap:11px}
.ranger input[type=range]{flex:1;accent-color:var(--a1);height:26px}
.ranger b{font-size:14px;font-variant-numeric:tabular-nums;width:42px;text-align:right}
.stars{display:inline-flex;gap:2px}
.stars i{font-style:normal;font-size:15px;line-height:1;color:color-mix(in srgb,var(--tx) 22%,transparent);cursor:pointer;transition:.15s;user-select:none}
.stars i.on{color:var(--warn)}
.stars.ro i{cursor:default;font-size:12px}
.starrow{display:flex;align-items:center;gap:8px}
.starrow>span{font-size:12.5px;color:var(--tx2);width:44px;flex:0 0 auto}
.starrow input{width:64px;height:34px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font-size:13.5px}
.starrow em{font-style:normal;font-size:11px;color:var(--tx3);flex:0 0 auto;min-width:56px}

/* ================= 任务 ================= */
.titem{display:flex;gap:10px;padding:11px 12px;border-radius:15px;background:var(--surf2);border:1px solid transparent;transition:.18s}
.titem:active{background:var(--surf3)}
.titem.done{opacity:.62}
.ck{width:23px;height:23px;border-radius:8px;border:2px solid var(--line-s);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.2s;color:transparent}
.ck svg{width:13px;height:13px}
.titem.done .ck{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff}
.tbody{flex:1;min-width:0}
.ttxt{font-size:14.5px;line-height:1.45;word-break:break-word}
.titem.done .ttxt{text-decoration:line-through;color:var(--tx3)}
.tmeta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.tmeta .m{font-size:11px;color:var(--tx3);display:inline-flex;align-items:center;gap:2px}
.tmeta .m b{color:var(--tx2);font-weight:600}
.score{font-size:10.5px;font-weight:700;padding:1.5px 6px;border-radius:6px;background:color-mix(in srgb,var(--a1) 18%,transparent);color:color-mix(in srgb,var(--a1) 82%,var(--tx))}
.score.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tacts{display:flex;gap:1px;flex:0 0 auto;align-items:flex-start}
.tbar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--tx) 9%,transparent);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ================= 专注 ================= */
.ring-wrap{position:relative;width:min(210px,52vw);margin:2px auto 0}
.ring{width:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bg{stroke:color-mix(in srgb,var(--tx) 10%,transparent);stroke-width:8}
.ring .fg{stroke:url(#pg);stroke-width:8;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .4s linear}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:46px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1.1}
.ring-c span{font-size:12px;color:var(--tx2)}
.pomo.run .ring-c b{color:color-mix(in srgb,var(--a2) 88%,var(--tx))}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bars .bv{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--a1),color-mix(in srgb,var(--a2) 58%,var(--a1)));min-height:3px}
.bars .bl{font-size:10px;color:var(--tx3);white-space:nowrap}
.noise{display:flex;gap:6px;flex-wrap:wrap}
.noise button{height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surf2);font-size:13px;color:var(--tx2);transition:.18s}
.noise button.on{background:color-mix(in srgb,var(--a1) 17%,transparent);border-color:color-mix(in srgb,var(--a1) 45%,transparent);color:var(--tx)}

/* ================= 记账 ================= */
.amt{display:flex;align-items:center;gap:9px;padding:12px 15px;border-radius:16px;background:var(--surf2);border:1px solid var(--line)}
.amt span{font-size:27px;font-weight:600;color:var(--tx2)}
.amt input{flex:1;min-width:0;font-size:32px;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.035em;height:44px}
.seg{display:flex;gap:4px;background:var(--surf2);padding:4px;border-radius:13px;border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:620;color:var(--tx2);transition:.2s}
.seg button.on{background:var(--surf);color:var(--tx)}
.seg button.on.out{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.seg button.on.in{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:13px;background:var(--surf2);border:1.5px solid transparent;transition:.18s}
.catbtn.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 15%,transparent)}
.catbtn .ci{font-size:19px;line-height:1}
.catbtn span{font-size:10.5px;color:var(--tx2)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:var(--surf2)}
.mrow .mi{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--surf3);flex:0 0 auto}
.mrow .mm{flex:1;min-width:0}
.mrow .mm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mm small{font-size:11px;color:var(--tx3)}
.mrow .mv{font-size:15px;font-weight:670;font-variant-numeric:tabular-nums;flex:0 0 auto}
.mrow .mv.o{color:var(--danger)}.mrow .mv.i{color:var(--ok)}
.cbar{display:flex;flex-direction:column;gap:7px}
.cbar .cb{display:flex;align-items:center;gap:9px}
.cbar .cn{width:62px;font-size:12px;color:var(--tx2);flex:0 0 auto}
.cbar .ct{flex:1;height:9px;border-radius:99px;background:color-mix(in srgb,var(--tx) 8%,transparent);overflow:hidden}
.cbar .ct i{display:block;height:100%;border-radius:99px;transition:width .6s}
.cbar .cv{width:70px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ================= 记录 ================= */
.moods{display:flex;gap:6px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:13px;background:var(--surf2);border:1.5px solid transparent;transition:.18s}
.mood .me{font-size:21px;line-height:1}
.mood span{font-size:10.5px;color:var(--tx2)}
.mood.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 15%,transparent)}
.mood.on span{color:var(--tx);font-weight:620}
.tagpick{display:flex;gap:6px;flex-wrap:wrap}
.tagpick button{padding:5px 11px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);background:var(--surf2);color:var(--tx2);transition:.18s}
.tagpick button.on{background:color-mix(in srgb,var(--a1) 16%,transparent);border-color:color-mix(in srgb,var(--a1) 42%,transparent);color:var(--tx);font-weight:620}
.jrow{display:flex;gap:7px;align-items:center}
.jrow .gn{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:var(--surf3);color:var(--tx2);font-weight:640;flex:0 0 auto}
.daystrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{flex:0 0 auto;width:46px;padding:7px 0;border-radius:12px;background:var(--surf2);border:1px solid transparent;transition:.18s;text-align:center}
.daystrip button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 15%,transparent)}
.daystrip button.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--a2);margin:3px auto 0}
.daystrip button b{display:block;font-size:13px;font-weight:620}
.daystrip button span{display:block;font-size:10px;color:var(--tx3)}

/* ================= 习惯 ================= */
.hitem{padding:11px 12px;border-radius:15px;background:var(--surf2);border:1px solid transparent;transition:.2s}
.hitem.ok{background:color-mix(in srgb,var(--a1) 10%,var(--surf2));border-color:color-mix(in srgb,var(--a1) 32%,transparent)}
.hrow{display:flex;align-items:center;gap:10px}
.hico{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;background:var(--surf3)}
.hname{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.hstreak{font-size:11.5px;color:var(--tx2);background:var(--surf3);padding:2px 8px;border-radius:99px;white-space:nowrap}
.hstreak b{color:var(--warn)}
.hcheck{width:29px;height:29px;border-radius:10px;border:2px solid var(--line-s);display:grid;place-items:center;transition:.22s;color:transparent;flex:0 0 auto}
.hcheck svg{width:14px;height:14px}
.hitem.ok .hcheck{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff}
.heat{display:flex;gap:3px;margin-top:9px}
.heat i{flex:1;height:19px;border-radius:5px;background:color-mix(in srgb,var(--tx) 8%,transparent);transition:.18s;border:1px solid transparent}
.heat i.on{background:linear-gradient(135deg,var(--a1),var(--a2));opacity:.9}
.heat i.fut{opacity:.3}
.heat i.td{box-shadow:0 0 0 2px color-mix(in srgb,var(--a2) 55%,transparent)}

/* ================= 舒尔特 ================= */
.schulte{display:grid;gap:6px;width:100%;max-width:400px;margin:0 auto;touch-action:manipulation}
.scell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:clamp(15px,4.4vw,24px);font-weight:660;
  background:var(--surf2);border:1.5px solid var(--line);transition:background .14s,color .14s;font-variant-numeric:tabular-nums;user-select:none}
.scell:active{transform:scale(.93)}
.scell.hit{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.scell.err{animation:err .28s}
@keyframes err{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bcircle{width:min(190px,50vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,color-mix(in srgb,var(--a1) 34%,transparent),color-mix(in srgb,var(--a2) 10%,transparent) 70%);
  transition:transform 1s cubic-bezier(.4,0,.3,1);box-shadow:0 0 60px -14px color-mix(in srgb,var(--a1) 60%,transparent)}
.bcircle span{font-size:16px;font-weight:620;letter-spacing:.08em;color:#fff}

/* ================= 弹层 / 面板 ================= */
.sheet{position:fixed;inset:0;z-index:200;display:none;max-width:440px;margin:0 auto;left:0;right:0;
  background:var(--bg);flex-direction:column}
.sheet.on{display:flex;animation:shin .32s cubic-bezier(.2,.85,.25,1)}
@keyframes shin{from{opacity:.4;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:44px}
.sheet-h.thin{padding:5px 14px;min-height:36px}
.sheet-h.thin b{font-size:15px}
.sheet-h b{font-size:16.5px;font-weight:660;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-f{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px}
.sheet-f .btn{flex:1}
.mask{position:fixed;inset:0;z-index:190;background:rgba(4,5,9,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{position:fixed;z-index:210;left:50%;top:50%;translate:-50% -50%;width:min(420px,90vw);max-height:86dvh;overflow-y:auto;
  background:var(--solid);border:1px solid var(--line-s);border-radius:22px;padding:20px;box-shadow:0 24px 60px -26px rgba(0,0,0,.85);animation:pop .3s cubic-bezier(.2,.85,.25,1)}
@keyframes pop{from{opacity:0;translate:-50% -46%;scale:.97}to{opacity:1;translate:-50% -50%;scale:1}}
.dlg h2{margin:0 0 4px;font-size:18px;font-weight:670}
.dlg .sub{font-size:13px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.dfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dfoot .btn{flex:1;min-width:96px}
.out{background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:12px;font-size:14px;min-height:44px;word-break:break-word;line-height:1.65;white-space:pre-wrap}
.out.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

/* ================= 底部 Tab ================= */
.tabbar{flex:0 0 auto;display:flex;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:13px;color:var(--tx3);transition:.2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button span{font-size:10px;font-weight:600}
.tabbar button.on{color:var(--a2)}
.tabbar button.on span{color:var(--tx)}

/* ================= Toast ================= */
.toasts{position:fixed;left:50%;translate:-50% 0;bottom:calc(var(--tabh) + 22px);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:88vw}
.toast{background:var(--solid);border:1px solid var(--line-s);padding:9px 18px;border-radius:99px;box-shadow:0 12px 30px -14px rgba(0,0,0,.8);font-size:13.5px;animation:tin .3s cubic-bezier(.2,.85,.25,1);display:flex;align-items:center;gap:8px}
.toast.out{animation:tout .28s ease forwards}
.toast svg{width:15px;height:15px;color:var(--ok);flex:0 0 auto}
@keyframes tin{from{opacity:0;translate:0 12px;scale:.95}to{opacity:1;translate:0 0;scale:1}}
@keyframes tout{to{opacity:0;translate:0 -6px}}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--a1) 75%,transparent);outline-offset:2px;border-radius:9px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= 启动兜底（脚本未执行时可见） ================= */
#boot{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:26px;
  background:radial-gradient(120% 80% at 50% 0%,#141a2e 0%,#0B0C11 60%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#boot.show{display:flex}
#boot .c{max-width:340px;text-align:center;color:#F4F6FA;line-height:1.75}
#boot .lg{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-bottom:6px;
  background:linear-gradient(115deg,#8B6BFF,#33E8C8);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .sub{font-size:12px;color:#9298AB;margin-bottom:18px}
#boot .box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:16px 17px;text-align:left}
#boot h4{margin:0 0 8px;font-size:14.5px;font-weight:700;color:#F4F6FA}
#boot p{margin:0 0 7px;font-size:13px;color:#BCC1D2}
#boot p:last-child{margin-bottom:0}
#boot b{color:#33E8C8;font-weight:700}
#boot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#33E8C8;margin-right:7px;animation:btp 1.1s infinite}
@keyframes btp{0%,100%{opacity:.25}50%{opacity:1}}
#boot2{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:26px;background:radial-gradient(120% 80% at 50% 0%,#141a2e 0%,#0B0C11 60%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.balcard{position:relative;overflow:hidden}
.hi-wx,.hm-clk,.hclk-wrap{overflow:hidden}
.page{overflow-x:hidden;overflow-y:auto!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page::-webkit-scrollbar{width:0;height:0;display:none}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
html[data-theme="light"]{--line:rgba(14,18,32,.24);--line-s:rgba(14,18,32,.40)}
html[data-theme="light"] .card,html[data-theme="light"] .card.tight{border-color:rgba(14,18,32,.22)}
.appgrid{grid-template-columns:repeat(3,1fr)!important;gap:14px 8px}
.appgrid .app .ic{width:clamp(46px,15.5vw,58px)!important;height:clamp(46px,15.5vw,58px)!important;border-radius:clamp(15px,5vw,19px)!important}
.appgrid .app .ic svg{width:clamp(23px,7.6vw,29px)!important;height:clamp(23px,7.6vw,29px)!important}
.appgrid .app>span:last-child{font-size:clamp(12px,3.5vw,13.5px)!important;font-weight:640}
.dhero{display:flex;align-items:flex-end;gap:10px;margin:2px 0 8px}
.dhero .big{font-size:clamp(30px,5.4vh,42px);font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.dhero .unit{font-size:14px;font-weight:650;color:var(--tx3);margin-bottom:4px}
.dhero .trend{font-size:12.5px;font-weight:680;padding:3px 9px;border-radius:9px;margin-bottom:5px}
.dhero .trend.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.dhero .trend.dn{color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,transparent)}
.dhero .trend.flat{color:var(--tx3);background:var(--surf2)}
.dhero .lab{font-size:12px;color:var(--tx3);margin-bottom:5px;flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);font-size:12px;font-weight:620;color:var(--tx2);transition:.15s}
.mchip i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.mchip.on{background:color-mix(in srgb,var(--a2) 13%,transparent);border-color:color-mix(in srgb,var(--a2) 45%,transparent);color:var(--tx)}
.dstat2{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dstat2>div{background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:8px 4px;text-align:center}
.dstat2 span{display:block;font-size:10.5px;color:var(--tx3);margin-bottom:2px}
.dstat2 b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.todaycard{border-radius:20px;padding:clamp(8px,1.6vh,13px) clamp(10px,2.2vw,14px);margin-bottom:clamp(6px,1.1vh,9px);background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 17%,var(--surf)),var(--surf));border:1px solid color-mix(in srgb,var(--a1) 26%,var(--line));position:relative;overflow:hidden}
.todaycard::after{content:"";position:absolute;right:-34px;top:-42px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a2) 26%,transparent),transparent 68%);pointer-events:none}
.tctop{display:flex;align-items:center;gap:7px;margin-bottom:9px;position:relative;z-index:1}
.tctop b{font-size:13.5px;font-weight:680;flex:1}
.tcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.tcgrid>div{background:color-mix(in srgb,var(--surf) 72%,transparent);border:1px solid var(--line);border-radius:14px;padding:clamp(6px,1.2vh,9px) 5px;text-align:center}
.tcgrid span{display:block;font-size:10.5px;color:var(--tx3);margin-bottom:3px;white-space:nowrap}
.tcgrid b{font-size:clamp(15px,2.4vh,19px);font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tcgrid small{display:block;font-size:10px;color:var(--tx3);margin-top:2px}
.tcgrid>div:active{transform:scale(.96)}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.mrow>div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:clamp(5px,1.1vh,8px) 3px;text-align:center}
.mrow span{display:block;font-size:10px;color:var(--tx3);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow b{font-size:clamp(12px,1.9vh,14px);font-weight:700;font-variant-numeric:tabular-nums}

.cdbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:14px;margin-bottom:8px;background:color-mix(in srgb,var(--danger) 11%,var(--surf));border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.cdbar .e{font-size:18px;line-height:1.1;flex:0 0 auto}
.cdbar .t{flex:1;min-width:0}
.cdbar .t b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdbar .t small{font-size:10.5px;color:var(--tx3)}
.cdbar .n{font-size:clamp(19px,3.1vh,24px);font-weight:750;color:var(--danger);font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:0 0 auto;line-height:1}
.cdbar .n em{font-style:normal;font-size:11px;font-weight:650;margin-left:1px}
.cdbar.more{background:var(--surf2);border-color:var(--line)}
.cdbar.more .n{color:var(--tx2);font-size:12px;font-weight:620}
.cdhome{width:38px;height:22px;border-radius:11px;background:var(--surf3);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.2s}
.cdhome::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cdhome.on{background:linear-gradient(120deg,var(--a1),var(--a2));border-color:transparent}
.cdhome.on::after{left:20px}
.card{border-radius:18px}
.card.tight{border-radius:17px}
.rmitem{border-radius:13px}
.mini{border-radius:10px}

#p-mine>.card.tight:last-child{overflow:hidden;flex:1 1 auto;min-height:0}
#p-mine>.card.tight:last-child .row{flex-wrap:nowrap;overflow:hidden}
#p-mine>.card.tight:last-child .xs{margin-top:4px!important}

@media (max-height:670px){#p-mine>.card.tight:last-child .xs{display:none}#p-mine .mrow{margin-bottom:6px}}
#p-data .dsegs{display:flex;gap:6px;flex-wrap:nowrap;min-width:0;margin-bottom:5px;overflow:hidden}
#p-data .dsegs .seg{flex:1 1 0;min-width:0;padding:3px;gap:3px;overflow:hidden}
#p-data .dsegs .seg button{flex:1 1 0;min-width:0;height:32px;padding:0 3px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip{min-height:29px;line-height:1.2;white-space:nowrap;flex:0 0 auto}
#p-data .chiprow{flex-wrap:wrap;overflow:hidden;max-height:none}
#p-data .chiprow::-webkit-scrollbar{display:none}
</style>

function quickAdd() {

function sortedTodos() {
  var d = getDay(CUR);
  var l = d.todos.slice(), s = S.settings.taskSort;
  function g(t, k) { return num(t[k], 5); }
  if (s === 'prio') l.sort(function (a, b) { return g(b, 'imp') * g(b, 'urg') - g(a, 'imp') * g(a, 'urg'); });
  else if (s === 'imp') l.sort(function (a, b) { return g(b, 'imp') - g(a, 'imp'); });
  else if (s === 'urg') l.sort(function (a, b) { return g(b, 'urg') - g(a, 'urg'); });
  else if (s === 'diff') l.sort(function (a, b) { return g(b, 'diff') - g(a, 'diff'); });
  else if (s === 'ach') l.sort(function (a, b) { return g(b, 'imp') * g(b, 'diff') - g(a, 'imp') * g(a, 'diff'); });
  else if (s === 'due') l.sort(function (a, b) { return (a.due ? parseD(a.due).getTime() : 9e15) - (b.due ? parseD(b.due).getTime() : 9e15); });
  else l.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });

  else if (tFilter === 'done') l = l.filter(function (t) { return t.done; });

}

function appHabit() {

function habitStreak(id) {
  var n = 0, d = today();
  if (!peek(d).habits[id]) d = addDays(d, -1);
  for (var i = 0; i < 500; i++) { if (peek(d).habits[id]) { n++; d = addDays(d, -1); } else break; }
  return n;
}
function habitBest(id) {
  var all = Object.keys(S.days).filter(function (k) { return S.days[k].habits && S.days[k].habits[id]; }).sort();
  var best = 0, cur = 0, prev = null;
  all.forEach(function (k) { if (prev && dayDiff(k, prev) === 1) cur++; else cur = 1; best = Math.max(best, cur); prev = k; });
  return best;
}
function drawHabit() {
  var d = getDay(CUR, true);
  var doneN = S.habits.filter(function (h) { return d.habits[h.id]; }).length;
  var html = '<div class="daystrip" id="hDays" style="margin-bottom:11px"></div>' +
    '<div class="card" style="margin-bottom:10px"><div class="ch"><h3>' + relLabel(CUR) + ' 打卡</h3><span class="sp"><span class="xs mut2">' + doneN + '/' + S.habits.length + '</span>' +
    (S.habits.length ? '<button class="mini" id="hAll">全完成</button>' : '') + '</span></div>';
  if (!S.habits.length) html += '<div class="empty">还没有习惯<br>点下面按钮，从一个微小的坚持开始</div>';
  else {
    html += S.habits.map(function (h) {
      var ok = !!d.habits[h.id], days = [];
      for (var i = 13; i >= 0; i--) days.push(addDays(today(), -i));
      var heat = days.map(function (k) {
        return '<i class="' + (peek(k).habits[h.id] ? 'on' : '') + (k > today() ? ' fut' : '') + (k === today() ? ' td' : '') + '" data-h="' + h.id + '" data-d="' + k + '"></i>';
      }).join('');
      return '<div class="hitem' + (ok ? ' ok' : '') + '" style="margin-bottom:8px">' +
        '<div class="hrow"><span class="hico">' + (h.icon || '✓') + '</span><span class="hname">' + esc(h.name) + '</span>' +
        '<span class="hstreak">连续 <b>' + habitStreak(h.id) + '</b> 天</span>' +
        '<button class="iconbtn" data-ed="' + h.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg></button>' +
        '<button class="hcheck" data-ck="' + h.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button></div>' +
        '<div class="heat">' + heat + '</div>' +
        '<div class="xs mut2" style="margin-top:6px">近 14 天完成 ' + days.filter(function (k) { return peek(k).habits[h.id]; }).length + ' 天 · 累计 ' + Object.keys(S.days).filter(function (k) { return S.days[k].habits && S.days[k].habits[h.id]; }).length + ' 天 · 最长 ' + habitBest(h.id) + ' 天</div></div>';
    }).join('');
  }

  if (S.habits.length) {
    var tot = 0, okN = 0;

    html += '<div class="card"><div class="ch"><h3>近 30 天</h3><span class="sp"><b style="font-size:15px">' + (tot ? Math.round(okN / tot * 100) : 0) + '%</b></span></div>' +
      '<div class="tbar"><i style="width:' + (tot ? okN / tot * 100 : 0) + '%"></i></div>' +
      '<div class="hint" style="margin-top:10px">点小方块可以补打卡或取消某一天。</div></div>';
  }
  $('#shBody').innerHTML = html;

  };
  $$('#shBody [data-ck]').forEach(function (b) {
    b.onclick = function () {

      save(); drawHabit();

  $$('#shBody .heat i').forEach(function (i4) {
    i4.onclick = function () {

      save(); drawHabit();
    };
  });
  var nb = $('#hNew'); if (nb) nb.onclick = function () { habitDlg(null); };

function geoPick() {

function dayText(d) {

  if (x.tags && x.tags.length) L.push('标签：' + x.tags.join('、'));
  if (x.text && x.text.trim()) L.push('总结：\n' + x.text.trim());
  if (x.note && x.note.trim()) L.push('速记：\n' + x.note.trim());
  var done = x.todos.filter(function (t) { return t.done; }), un = x.todos.filter(function (t) { return !t.done; });
  if (done.length) L.push('完成任务（' + done.length + '）：\n' + done.map(function (t) { return '  ✔ ' + t.text + '（成就 ' + num(t.imp, 5) * num(t.diff, 5) + '）'; }).join('\n'));
  if (un.length) L.push('未完成（' + un.length + '）：\n' + un.map(function (t) { return '  • ' + t.text + '（优先 ' + num(t.imp, 5) * num(t.urg, 5) + '）'; }).join('\n'));
  if (x.focus && x.focus.length) L.push('专注：' + x.focus.length + ' 段 / ' + x.focus.reduce(function (a, f) { return a + (f.min || 0); }, 0) + ' 分钟');
  if (x.money && x.money.length) {
    var o = x.money.filter(function (y) { return y.type === 'out'; }).reduce(function (a, y) { return a + y.amount; }, 0);
    var i5 = x.money.filter(function (y) { return y.type === 'in'; }).reduce(function (a, y) { return a + y.amount; }, 0);
    L.push('记账：支出 ¥' + money(o) + (i5 ? ' / 收入 ¥' + money(i5) : ''));
  }
  if (x.water) L.push('饮水：' + x.water + ' ml');
  var hk = Object.keys(x.habits || {}).filter(function (h) { return x.habits[h]; })
    .map(function (h) { var o2 = S.habits.filter(function (y) { return y.id === h; })[0]; return o2 ? (o2.icon || '') + o2.name : ''; }).filter(Boolean);
  if (hk.length) L.push('习惯：' + hk.join('、'));
  return L.join('\n');
}

  SB.on = true; SB.next = 1; SB.err = 0; SB.t0 = Date.now();
  var total = SB.n * SB.n, arr = [];
  for (var i = 1; i <= total; i++) arr.push(i);
  for (var j = arr.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), t = arr[j]; arr[j] = arr[k]; arr[k] = t; }

  var i2 = $('#sInfo'); if (i2) i2.textContent = SB.mode === 'letter' ? '从 A 开始按顺序找' : SB.mode === 'rev' ? '从 ' + total + ' 倒着找回来' : '从 1 开始按顺序找';

function drawGrid() {

}
function sbHit(v, el) {
  if (!SB.on) return;

    SB.err++;

    setTimeout(function () { el.classList.remove('err'); }, 300);
    var i = $('#sErr'); if (i) i.textContent = SB.err;

    return;

  SB.next++;
  var c = $('#sCnt'); if (c) c.textContent = SB.next - 1;
  var b = $('#sBar'); if (b) b.style.width = ((SB.next - 1) / (SB.n * SB.n) * 100) + '%';

  var prev = S.game.schulte[key];
  var isNew = !prev || sec < prev;
  if (isNew) S.game.schulte[key] = sec;
  S.game.history = S.game.history || [];
  S.game.history.unshift({ n: SB.n, mode: SB.mode, sec: sec, err: SB.err, at: Date.now() });

    '<div class="sm mut" style="margin-top:4px">' + (SB.n * SB.n) + ' 格 · 错 ' + SB.err + ' 次' + (isNew ? ' · 🎉 新纪录' : ' · 最佳 ' + S.game.schulte[key] + '"') + '</div>' +

        else sum += v;

    }

      var mr = monthRange(ds(ref)), sum2 = 0, cnt2 = 0;
      for (var k3 = mr[0]; k3 <= mr[1]; k3 = addDays(k3, 1)) {
        var v3 = metricVal(k3, m);

        else sum2 += v3;

function lineSvg(data, color, unit) {

    g + '<path d="' + area + '" fill="url(#ag)"/><path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + xl + '</svg>';
}

/* ============ 事件与启动 ============ */
function bindGlobal() {
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var inField = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if ($('.dlg')) { closeDlg(); return; }
      if (SHEET.open) { closeSheet(); return; }
      return;
    }
    if (inField || SHEET.open || $('.dlg')) return;
    if (e.altKey) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); setCur(addDays(CUR, -1)); toast(relLabel(CUR)); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); if (CUR < today()) { setCur(addDays(CUR, 1)); toast(relLabel(CUR)); } }
      return;
    }
    var k = e.key.toLowerCase();
    if (/^[1-4]$/.test(e.key)) { e.preventDefault(); goTab(TABS[+e.key - 1].id); }
    else if (k === 'n') { e.preventDefault(); openApp('task'); setTimeout(function () { var x = $('#tIn'); if (x) x.focus(); }, 200); }
    else if (e.key === ' ') { e.preventDefault(); if (!SHEET.open || SHEET.id !== 'focus') openApp('focus'); fToggle(); }
    else if (k === 't') { cycleTheme(); }
    else if (k === 'h') { if (CUR !== today()) { setCur(today()); toast('已回到今天'); } }
    else if (k === '?' || e.key === '/') { e.preventDefault(); helpDlg(); }
    // 舒尔特数字键盘
    else if (SHEET.id === 'schulte' && SB.on && SB.mode !== 'letter' && /^[0-9]$/.test(e.key)) {
      var want = +e.key, v = SB.mode === 'rev' ? SB.n * SB.n + 1 - want : want;
      var el = $('#sGrid .scell[data-v="' + v + '"]');
      if (el) sbHit(v, el);
    }
  });
  $('#fileIn').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (!o || typeof o !== 'object' || !o.days) throw 0;
        localStorage.setItem(KEY, JSON.stringify(o));
        toast('导入成功，正在刷新');
        setTimeout(function () { location.reload(); }, 700);
      } catch (e2) { toast('文件格式不正确', 'err'); }
    };
    r.readAsText(f);
    this.value = '';
  };
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
}
window.__LUMEN_INIT__ = function init() {
  applyTheme();
  buildTabs();
  bindGlobal();
  saveNow();
  lastDayKey = '';
  tickClock();
  setInterval(tickClock, 1000);
  var t = 'home';
  try { t = localStorage.getItem('lumen.tab') || 'home'; } catch (e) { }
  if (!TABS.some(function (x) { return x.id === t; })) t = 'home';
  goTab(t);
  loadWeather();
  setInterval(function () { loadWeather(); }, 600000);
  if (!localStorage.getItem(KEY) && !localStorage.getItem('lumen.v2')) {
    setTimeout(function () { toast('欢迎使用晨昏 · 点底部「应用」开始'); }, 800);
  }
  bootDone();
};
/* ============ 启动兜底：脚本跑通后移除提示层 ============ */
function bootDone() {
  try {
    document.documentElement.setAttribute('data-booted', '1');
    var b = document.getElementById('boot');
    if (b && b.parentNode) b.parentNode.removeChild(b);   /* 立即移除，不再淡出闪烁 */
  } catch (e) { }
}

function renderHome() {
  var host = $('#p-home');
  if (!host) return;
  var now = new Date(), st = S.settings;
  var h = now.getHours();
  var hi = h < 5 ? '夜深了' : h < 9 ? '早上好' : h < 12 ? '上午好' : h < 14 ? '午安' : h < 18 ? '下午好' : h < 23 ? '晚上好' : '夜深了';
  var ln = lunarStr(now);
  var d = getDay(CUR, true);
  var doneN = d.todos.filter(function (t) { return t.done; }).length;
  var hDone = S.habits.filter(function (x) { return d.habits[x.id]; }).length;
  var fmin = d.focus.reduce(function (a, x) { return a + (x.min || 0); }, 0);
  var out = d.money.filter(function (m) { return m.type === 'out'; }).reduce(function (a, m) { return a + m.amount; }, 0);
  var mi = now.getMinutes(), HH = st.hour24 ? h : (h % 12 === 0 ? 12 : h % 12);

  /* 天气 */
  var wxHtml;
  if (wx) {
    var cu = wx.j.current, da = wx.j.daily, ic = wInfo(cu.weather_code, cu.is_day);
    var pop = da.precipitation_probability_max[0] || 0, rainy = isRainyNow();
    wxHtml = '<button class="hm-wx" id="hWx">' + iconSvg(ic.id, 'wi') +
      '<span class="wm"><span class="t1"><b>' + Math.round(cu.temperature_2m) + '°</b><span>' + ic.name + ' · ' + Math.round(da.temperature_2m_min[0]) + '°/' + Math.round(da.temperature_2m_max[0]) + '°</span></span>' +
      '<span class="t2">' + esc((st.city.admin ? st.city.admin + ' · ' : '') + st.city.name) + ' · 体感 ' + Math.round(cu.apparent_temperature) + '° · 降水 <b class="' + (pop >= st.rainAlert ? 'rr' : '') + '">' + pop + '%</b> · 湿度 ' + cu.relative_humidity_2m + '%</span></span></button>';
    if (rainy) wxHtml += '<div class="hm-al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ADVI.um + '</svg><span>' + (isRain(cu.weather_code) ? '正在' + ic.name : '今日有降水') + '，<b>出门记得带伞</b></span></div>';
    else if ((da.uv_index_max[0] || 0) >= 8) wxHtml += '<div class="hm-al bl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">' + ADVI.sun + '</svg><span>紫外线很强，<b>注意防晒</b></span></div>';
    var mx = Math.round(da.temperature_2m_max[0]), mn = Math.round(da.temperature_2m_min[0]);
    if (mx - mn >= 9) wxHtml += '<div class="hm-al gr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ADVI.shirt + '</svg><span>温差 <b>' + (mx - mn) + '°</b> · ' + dressAdvice(Math.round(cu.apparent_temperature))[0] + '</span></div>';
  } else {
    wxHtml = '<button class="hm-wx" id="hWx">' + iconSvg('cloud', 'wi') +
      '<span class="wm"><span class="t1"><b>—</b><span>天气暂不可用</span></span>' +
      '<span class="t2">' + esc((st.city.admin ? st.city.admin + ' · ' : '') + st.city.name) + ' · 联网后自动显示</span></span></button>';
  }

  var yearStart = new Date(now.getFullYear(), 0, 1), yearEnd = new Date(now.getFullYear() + 1, 0, 1);
  var pct = (now - yearStart) / (yearEnd - yearStart) * 100;
  var left = Math.max(0, Math.ceil((yearEnd - now) / 86400000));

  host.innerHTML = '<div class="hm">' +
    '<div class="hm-top"><div class="hm-hi"><b>' + hi + (st.name ? '<em>，' + esc(st.name) + '</em>' : '') + '</b>' +
    '<span>' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + WEEK[now.getDay()] + (ln ? ' · ' + ln : '') + '</span></div>' +
    '<button class="hm-ic" id="hSet" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.1 14.2a1.5 1.5 0 0 0 .3 1.7l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.5 1.5 0 0 0-2.6 1v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.5 1.5 0 0 0-2.6-1l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.5 1.5 0 0 0-1-2.6h-.2a1.9 1.9 0 1 1 0-3.8h.1a1.5 1.5 0 0 0 1-2.6l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.5 1.5 0 0 0 2.6-1V3.9a1.9 1.9 0 1 1 3.8 0v.2a1.5 1.5 0 0 0 2.6 1l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.5 1.5 0 0 0 1 2.6h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.5 1.5 0 0 0-1.4.9z"/></svg></button></div>' +

    '<div class="hm-clk"><div class="hm-t"><span id="clkH">' + (st.hour24 ? pad(HH) : HH) + ':' + pad(mi) + '</span><i id="clkS">:' + pad(now.getSeconds()) + '</i><u id="clkAp">' + (st.hour24 ? '' : (h < 12 ? 'AM' : 'PM')) + '</u></div>' +
    '<div class="hm-meta"><div class="w">第 ' + weekNo(now) + ' 周 · ' + zodiac(now.getMonth() + 1, now.getDate()) + '座</div>' +
    '<div class="z">' + tipOfDay() + '</div>' +
    '<div class="hm-pg"><div class="l"><span>' + now.getFullYear() + ' 年进度</span><b>' + pct.toFixed(1) + '%</b></div>' +
    '<div class="b"><i id="yFill"></i></div>' +
    '<div class="z" style="margin-top:3px">今年还剩 ' + left + ' 天</div></div></div></div>' +

    wxHtml +

    '<div class="hm-tl">' +
    hmTile(doneN + '/' + d.todos.length, '待办', d.todos.length ? '完成 ' + Math.round(doneN / d.todos.length * 100) + '%' : '未添加', 'var(--a1)', 'task') +
    hmTile(hDone + '/' + S.habits.length, '习惯', S.habits.length ? (hDone === S.habits.length ? '全完成' : '差 ' + (S.habits.length - hDone)) : '未设置', 'var(--ok)', 'habit') +
    hmTile(fmin, '专注', d.focus.length ? d.focus.length + ' 段 · ' + minStr(fmin) : '未开始', 'var(--a2)', 'focus') +
    hmTile('¥' + (out >= 10000 ? (out / 10000).toFixed(1) + '万' : Math.round(out)), '支出', d.money.length ? d.money.length + ' 笔' : '未记账', 'var(--warn)', 'money') +
    '</div>' +

    '<button class="achday" id="hAch">' + homeAchHtml() + '</button>' +

    '<div class="hm-rm"><div class="hm-rmh"><h3>今日提醒</h3><span class="n" id="rmN"></span></div>' +
    '<div class="hm-rml" id="hRm"></div></div>' +
    '</div>';

  var f = $('#yFill');
  if (f) requestAnimationFrame(function () { f.style.width = pct.toFixed(2) + '%'; });
  $('#hSet').onclick = function () { goTab('mine'); };
  var hw = $('#hWx'); if (hw) hw.onclick = function () { openApp('weather'); };
  $$('#p-home .hm-tl button').forEach(function (b) { b.onclick = function () { openApp(b.dataset.go); }; });
  var ha = $('#hAch'); if (ha) ha.onclick = function () { openApp('achieve'); };
  renderHomeRemind();
  tickClock();
}
function hmTile(v, k, s, c, go) {
  return '<button data-go="' + go + '"><span class="v" style="color:' + c + '">' + v + '</span><span class="k">' + k + '</span><span class="s">' + s + '</span></button>';
}
function renderHomeRemind() {
  var el = $('#hRm'); if (!el) return;
  var items = buildReminders();
  var n = $('#rmN'); if (n) n.textContent = items.length ? items.length + ' 条' : '';
  if (!items.length) { el.innerHTML = '<div class="hm-rme">今天没有需要特别留意的事<br>安心休息一下</div>'; return; }
  el.innerHTML = items.map(function (it) {
    return '<button class="hm-ri ' + (it.lv === 'dg' ? 'dg' : it.lv === 'warn' ? 'wn' : '') + '"' + (it.go ? ' data-go="' + it.go + '"' : '') + '><span class="e">' + it.e + '</span>' +
      '<span class="x"><b>' + esc(it.t) + '</b><small>' + esc(it.s) + '</small></span>' +
      (it.go ? '<span class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>' : '') + '</button>';
  }).join('');
  $$('#hRm .hm-ri').forEach(function (b) {
    if (b.dataset.go) b.onclick = function () { openApp(b.dataset.go); };
  });
}

function homeAchHtml() {

/* ================= 成就计算 ================= */
var QCOEF = { 5: 1.5, 4: 1.2, 3: 1, 2: .8, 1: .6 };
var QNAME = { 5: '完美', 4: '很好', 3: '达标', 2: '将就', 1: '敷衍' };
function taskQ(t) { var q = clamp(Math.round(num(t.q, 3)), 1, 5); return (QCOEF || {})[q] || 1; }
function taskAch(t) {
  if (!t.done) return 0;
  var imp = Math.max(0, num(t.imp, 5)), dif = num(t.diff, 5);
  return Math.cbrt(imp) * dif * taskQ(t);
}
function r1(n) { return Math.round(n * 10) / 10; }
function focusAchOf(f) {
  if (f.ach != null) return num(f.ach, 0);
  return num(S.settings.achPerFocus, 10) + num(f.min, 0) * num(S.settings.achPerMin, 0);
}
function habitTimes(h) { return clamp(Math.round(num(h.times, 1)), 1, 20); }
function habitAchOf(h) { return num(h.ach, 5); }
function hCount(h, k) {
  var v = peek(k).habits[h.id];
  if (v === true) return 1;
  return num(v, 0);
}
function habitDoneOn(h, k) { return hCount(h, k) >= habitTimes(h); }
function dayAchBreak(k) {
  var x = peek(k), task = 0, focus = 0, habit = 0, extra = 0;
  x.todos.forEach(function (t) { task += taskAch(t); });
  x.focus.forEach(function (f) { focus += focusAchOf(f); });
  S.habits.forEach(function (h) { if (habitDoneOn(h, k)) habit += habitAchOf(h); });
  (S.extra || []).forEach(function (e) { if (e.day === k) extra += num(e.val, 0); });
  return { task: task, focus: focus, habit: habit, extra: extra, total: task + focus + habit + extra };
}
function achDays() {
  var s = {};
  allDays().forEach(function (k) { s[k] = 1; });
  (S.extra || []).forEach(function (e) { if (e.day) s[e.day] = 1; });
  return Object.keys(s).sort();
}
function totalAch() { return achDays().reduce(function (a, k) { return a + dayAchBreak(k).total; }, 0); }
function achPoints(days) {
  var p = 0, n = 0;
  (days || []).forEach(function (k) {
    var x = dayAchBreak(k); p += x.total;
    peek(k).todos.forEach(function (t) { if (t.done) n++; });
  });
  return { p: p, n: n };
}

/* ================= 余额 / 兑换 ================= */
function moneySum() {
  var o = 0, i = 0;
  Object.keys(S.days).forEach(function (k) {
    peek(k).money.forEach(function (m) { if (m.type === 'out') o += num(m.amount, 0); else i += num(m.amount, 0); });
  });
  return { out: o, in: i };
}
function exchSum() {
  var a = 0, m = 0;
  (S.exchange || []).forEach(function (e) { a += num(e.ach, 0); m += num(e.money, 0); });
  return { ach: a, money: m };
}
function balance() {
  var ms = moneySum(), ex = exchSum();
  return num(S.settings.initBalance, 0) + ex.money + ms.in - ms.out;
}
function availAch() { return Math.max(0, totalAch() - exchSum().ach); }
function achToMoney(a) {
  var r = num(S.settings.exRate, 10), m = num(S.settings.exMoney, 1);
  if (r <= 0) return 0;
  return a / r * m;
}

/* ================= 通用折线图弹窗 ================= */
function aggVals(vals, agg) {
  if (!vals.length) return 0;
  if (agg === 'sum') return vals.reduce(function (a, b) { return a + b; }, 0);
  if (agg === 'max') return Math.max.apply(null, vals);
  if (agg === 'best') return Math.min.apply(null, vals);
  return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
}
function aggSeries(fn, gran, range, agg, skipZero) {
  var out = [], i, k, j;
  if (gran === 'd') {
    for (i = range - 1; i >= 0; i--) {
      k = addDays(today(), -i);
      var dv = fn(k);
      /* skipZero：该指标的 0 表示「无记录」，不参与统计（如舒尔特用时） */
      if (skipZero) {
        var okv = (dv != null && num(dv, 0) > 0);
        out.push({ l: parseD(k).getDate() + '', v: okv ? num(dv, 0) : 0, has: okv, k: k });
      } else {
        out.push({ l: parseD(k).getDate() + '', v: num(dv, 0) || 0, has: true, k: k });
      }
    }
  } else if (gran === 'w') {
    var weeks = Math.max(1, Math.round(range / 7));
    for (j = weeks - 1; j >= 0; j--) {
      var end = addDays(today(), -j * 7), st2 = addDays(end, -6), vs = [];
      for (k = st2; k <= end; k = addDays(k, 1)) { var v = fn(k); if (v != null && v > 0) vs.push(v); }
      out.push({ l: fmtMD(st2).replace('日', ''), v: aggVals(vs, agg), has: vs.length > 0 });
    }
  } else {
    var ms = Math.max(1, Math.round(range / 30));
    for (i = ms - 1; i >= 0; i--) {
      var ref = new Date(); ref.setDate(1); ref.setMonth(ref.getMonth() - i);
      var mr = monthRange(ds(ref)), vs2 = [];
      for (k = mr[0]; k <= mr[1]; k = addDays(k, 1)) { var v2 = fn(k); if (v2 != null && v2 > 0) vs2.push(v2); }
      out.push({ l: (parseD(mr[0]).getMonth() + 1) + '月', v: aggVals(vs2, agg), has: vs2.length > 0 });
    }
  }
  return out;
}

    $$('#ckR button').forEach(function (b) { b.classList.toggle('on', +b.dataset.r === range); });

}
function lineSvg2(a, b, c1, c2) {
  var W = 300, H = 150, PL = 32, PR = 10, PT = 14, PB = 22;
  var all = a.map(function (d) { return d.v; }).concat(b ? b.map(function (d) { return d.v; }) : []);
  var max = Math.max.apply(null, all.concat([1]));
  var iw = W - PL - PR, ih = H - PT - PB;
  var X = function (i, n) { return PL + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
  var Y = function (v) { return PT + ih - v / max * ih; };
  var g = '';
  for (var i = 0; i <= 3; i++) {
    var y = PT + ih * i / 3, v = max - max * i / 3;
    g += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (PL - 5) + '" y="' + (y + 3.5).toFixed(1) + '" fill="var(--tx3)" font-size="9" text-anchor="end">' + (v >= 1000 ? Math.round(v / 1000) + 'k' : (v >= 10 || v === 0 ? Math.round(v) : r1(v))) + '</text>';
  }
  function path(s, n) { return s.map(function (d, i) { return X(i, n).toFixed(1) + ',' + Y(d.v).toFixed(1); }).join(' L'); }
  var p1 = path(a, a.length);
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + g +
    '<path d="M' + X(0, a.length).toFixed(1) + ',' + (PT + ih) + ' L' + p1 + ' L' + X(a.length - 1, a.length).toFixed(1) + ',' + (PT + ih) + ' Z" fill="' + c1 + '" opacity=".13"/>' +
    '<path d="M' + p1 + '" fill="none" stroke="' + c1 + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  if (b) {
    var p2 = path(b, b.length);
    svg += '<path d="M' + p2 + '" fill="none" stroke="' + c2 + '" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  a.forEach(function (d, i) { if (a.length <= 32 || i === a.length - 1) svg += '<circle cx="' + X(i, a.length).toFixed(1) + '" cy="' + Y(d.v).toFixed(1) + '" r="' + (i === a.length - 1 ? 3.2 : 2) + '" fill="' + c1 + '" stroke="var(--surf)" stroke-width="1.2"/>'; });
  var step = Math.max(1, Math.ceil(a.length / 6));
  a.forEach(function (d, i) { if (i % step === 0 || i === a.length - 1) svg += '<text x="' + X(i, a.length).toFixed(1) + '" y="' + (H - 6) + '" fill="var(--tx3)" font-size="9" text-anchor="middle">' + esc(d.l) + '</text>'; });
  return svg + '</svg>';
}

function taskItems() {

function drawTaskHist() {

  var items = taskItems().slice(0, 40).map(function (it) {
    return {
      id: it.d + '|' + it.t.id,

      l2: relLabel(it.d) + ' · 重' + starOf(it.t.imp) + ' 难' + starOf(it.t.diff) + (it.t.done ? ' · ' + QNAME[clamp(Math.round(num(it.t.q, 3)), 1, 5)] : ''),

      cls: it.t.done ? 'ach' : ''

  });
  host.innerHTML = histBox(items, { onEdit: 1, onDel: 1, empty: '还没有任何任务记录' });

      save(); drawTasks();
    }, '删除');
  });
}
function drawTaskStat() {
  var el = $('#tStat'); if (!el) return;
  var d = getDay(CUR);
  var done = d.todos.filter(function (t) { return t.done; });
  var ach = done.reduce(function (a, t) { return a + taskAch(t); }, 0);
  var streak = 0;
  for (var i = 0; i < 400; i++) {
    var k = addDays(today(), -i), x = peek(k);
    if (x.todos.length && x.todos.every(function (t) { return t.done; })) streak++;
    else if (i > 0) break;
    else if (x.todos.length) break;
  }
  el.innerHTML = '<div class="row" style="gap:8px">' +
    ['完成 ' + done.length + '/' + d.todos.length, '成就 ' + r1(ach), '全清 ' + streak + '天'].map(function (t) {
      return '<span class="tag a">' + t + '</span>';
    }).join('') + '</div>' +
    '<div class="hint" style="margin-top:8px">点右上角「?」看优先级和积分怎么算。</div>';
}

/* ================= 习惯：频率 / 次数 / 多次打卡 / 成就 / 历史 / 对比图 ================= */
function hPeriodCount(h, k) {
  var f = h.freq || 'day', x, s = 0;
  if (f === 'week') { var r = weekRange(k); for (x = r[0]; x <= r[1]; x = addDays(x, 1)) s += hCount(h, x); return s; }
  if (f === 'month') { var m = monthRange(k); for (x = m[0]; x <= m[1]; x = addDays(x, 1)) s += hCount(h, x); return s; }
  return hCount(h, k);
}
function habitDoneOn(h, k) { return hPeriodCount(h, k) >= habitTimes(h); }
function habitAchDay(h, k) {
  var times = habitTimes(h), f = h.freq || 'day';
  if (hCount(h, k) <= 0) return false;
  if (f === 'day') return hCount(h, k) >= times;
  var r = f === 'week' ? weekRange(k) : monthRange(k), cum = 0, x;
  for (x = r[0]; x <= k; x = addDays(x, 1)) cum += hCount(h, x);
  var prev = cum - hCount(h, k);
  return prev < times && cum >= times;
}
function dayAchBreak(k) {
  var x = peek(k), task = 0, focus = 0, habit = 0, extra = 0;
  x.todos.forEach(function (t) { task += taskAch(t); });
  x.focus.forEach(function (f) { focus += focusAchOf(f); });
  S.habits.forEach(function (h) { if (habitAchDay(h, k)) habit += habitAchOf(h); });
  (S.extra || []).forEach(function (e) { if (e.day === k) extra += num(e.val, 0); });
  return { task: task, focus: focus, habit: habit, extra: extra, total: task + focus + habit + extra };
}

/* ================= 主页提醒：多展示待办事项 ================= */
function buildReminders() {
  var items = buildRemindersBase().filter(function (it) { return it.t.indexOf('件高优先级待办') < 0; });
  var d = getDay(CUR, true);
  var un = d.todos.filter(function (t) { return !t.done; });
  un.sort(function (a, b) { return num(b.imp, 5) * num(b.urg, 5) - num(a.imp, 5) * num(a.urg, 5); });
  var head = un.slice(0, 5).map(function (t) {
    var over = !!(t.due && t.due < today());
    return {
      e: over ? '⏰' : '📌',
      t: t.text,
      s: '重要 ' + starOf(t.imp) + '★ · 紧迫 ' + starOf(t.urg) + '★ · 难 ' + starOf(t.diff) + '★' + (over ? ' · 已过期' : ''),
      lv: over ? 'dg' : 'warn', go: 'task'

  if (un.length > 5) head.push({ e: '📋', t: '还有 ' + (un.length - 5) + ' 件待办没做', s: '点这里去任务里处理', lv: '', go: 'task' });

}

/* 18 岁以上（20 岁左右）参考阈值 [优秀, 良好]，来源：舒尔特方格评分标准对照表 + 成人 5×5 常模（25-35 秒为典型） */
var SBSTD = { 3: [5, 8], 4: [10, 16], 5: [20, 30], 6: [40, 55] };
function sbJudge(n, sec) {
  var s = SBSTD[n] || [16, 24];
  if (sec <= s[0] * .5) return ['卓越', '🏆', 'var(--warn)', '这个速度已接近长期专业训练者的水平'];
  if (sec <= s[0]) return ['优秀', '🥇', 'var(--warn)', '注意力集中度很好，视觉搜索很快'];
  if (sec <= s[1]) return ['良好', '👍', 'var(--ok)', '达到 18–40 岁成年人的正常水平'];
  if (sec <= s[1] * 1.6) return ['中等', '🙂', 'var(--a2)', '还有提升空间，每天练几分钟就会变快'];
  return ['待提升', '🌱', 'var(--tx2)', '先求稳再求快，别急着跳数，放松呼吸'];
}
function sbDayKey(h) { return h.day || ds(new Date(h.at || Date.now())); }
function sbModeOf(h) { return h.mode || 'num'; }
function sbDay(k, n, mode, kind) {
  var vs = (S.game.history || []).filter(function (h) {
    return sbDayKey(h) === k && num(h.n, 5) === n && (mode === 'all' || sbModeOf(h) === mode);
  }).map(function (h) { return num(h.sec, 0); }).filter(function (v) { return v > 0; });
  if (!vs.length) return 0;
  if (kind === 'best') return Math.min.apply(null, vs);
  return vs.reduce(function (a, b) { return a + b; }, 0) / vs.length;
}

function seriesData() {
  var m = DM.metric, gran = DM.gran, n = DM.range, out = [], i, k, j, end = CUR;
  if (gran === 'd') {
    for (i = n - 1; i >= 0; i--) { k = addDays(end, -i); out.push({ l: parseD(k).getDate() + '', v: metricVal(k, m), k: k }); }
  } else if (gran === 'w') {
    var weeks = Math.max(1, Math.round(n / 7));
    for (j = weeks - 1; j >= 0; j--) {
      var e2 = addDays(end, -j * 7), st2 = addDays(e2, -6), sum = 0, cnt = 0;
      for (k = st2; k <= e2; k = addDays(k, 1)) {
        var v = metricVal(k, m);
        if (m === 'mood' || m === 'habit' || m === 'ach') { if (v) { sum += v; cnt++; } }
        else sum += v;
      }
      out.push({ l: fmtMD(st2).replace('日', ''), v: (m === 'mood' || m === 'habit' || m === 'ach') ? (cnt ? sum / cnt : 0) : sum });
    }
  } else {
    var months = Math.max(1, Math.round(n / 30));
    var ref0 = parseD(end);
    for (i = months - 1; i >= 0; i--) {
      var ref = new Date(ref0.getFullYear(), ref0.getMonth() - i, 1);
      var mr = monthRange(ds(ref)), sum2 = 0, cnt2 = 0;
      for (k = mr[0]; k <= mr[1]; k = addDays(k, 1)) {
        var v3 = metricVal(k, m);
        if (m === 'mood' || m === 'habit' || m === 'ach') { if (v3) { sum2 += v3; cnt2++; } }
        else sum2 += v3;
      }
      out.push({ l: (parseD(mr[0]).getMonth() + 1) + '月', v: (m === 'mood' || m === 'habit' || m === 'ach') ? (cnt2 ? sum2 / cnt2 : 0) : sum2 });
    }
  }
  return out;
}

/* ============ 睡眠应用 ============ */
var SLEEP_DEF = { bestLow: 7, bestHigh: 8.5, durAch: 10, durPen: 2, wakeBest: 8, wakeAch: 5, wakePen: 2 };
function sleepCfg() {
  var v = S.settings.sleep || {};
  return {
    bestLow: num(v.bestLow, 7), bestHigh: num(v.bestHigh, 8.5),
    durAch: num(v.durAch, 10), durPen: num(v.durPen, 2),
    wakeBest: num(v.wakeBest, 8), wakeAch: num(v.wakeAch, 5), wakePen: num(v.wakePen, 2)
  };
}
function sleepOfDay(k) { var d = peek(k); return (d && d.sleep) ? d.sleep : null; }
function sleepDurScore(h) {
  var c = sleepCfg();
  if (h <= 0) return 0;
  var diff = 0;
  if (h < c.bestLow) diff = c.bestLow - h;
  else if (h > c.bestHigh) diff = h - c.bestHigh;
  var steps = Math.ceil(Math.round(diff * 100) / 50);   /* 每 0.5 小时一档 */
  return Math.max(0, c.durAch - steps * c.durPen);
}
function sleepWakeScore(wake) {
  var c = sleepCfg();
  if (!wake) return 0;
  var p = String(wake).split(':');
  var hv = num(p[0], -1) + num(p[1], 0) / 60;
  if (hv < 0) return 0;
  if (hv <= c.wakeBest) return c.wakeAch;
  var steps = Math.ceil(Math.round((hv - c.wakeBest) * 100) / 50);
  return Math.max(0, c.wakeAch - steps * c.wakePen);
}
function sleepAch(s) {
  if (!s) return 0;
  return Math.max(0, sleepDurScore(num(s.h, 0)) + sleepWakeScore(s.wake));
}
function sleepTotalOfDay(k) { return sleepAch(sleepOfDay(k)); }
/* 成就分解：加入睡眠 */
function dayAchBreak(k) {
  var x = peek(k), task = 0, focus = 0, habit = 0, extra = 0, sleep = sleepTotalOfDay(k);
  x.todos.forEach(function (t) { task += taskAch(t); });
  x.focus.forEach(function (f) { focus += focusAchOf(f); });
  S.habits.forEach(function (h) { if (habitDoneOn(h, k)) habit += habitAchOf(h); });
  (S.extra || []).forEach(function (e) { if (e.day === k) extra += num(e.val, 0); });
  return { task: task, focus: focus, habit: habit, extra: extra, sleep: sleep, total: task + focus + habit + extra + sleep };
}

function openDlg(o) {
  var host = document.getElementById('dlgHost');

  DLGV++;
  host.innerHTML = '';
  var mk = document.createElement('div');
  mk.className = 'mask';

    '<div class="dfoot"><button class="btn" data-dc>' + esc(o.cancel || '关闭') + '</button>' +
    (o.ok ? '<button class="btn" data-dok>' + esc(o.ok) + '</button>' : '') + '</div>';

    '<div class="dlg"' + (o.width ? ' style="width:min(' + o.width + 'px,90vw)"' : '') + '>' +

    (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') +
    '<div class="dbody">' + (o.body || '') + '</div>' +
    foot + '</div>');
  $$('[data-dc]', host).forEach(function (b) { b.onclick = closeDlg; });
  var okb = $('[data-dok]', host);
  if (okb) okb.onclick = function () { if (o.onOk && o.onOk() === false) return; closeDlg(); };

}

/* ============ 11. 学习应用 ============ */
var QSTUDY = { 1: 0.6, 2: 0.8, 3: 1, 4: 1.3, 5: 1.6 };
function studyRate() { return num(S.settings.studyRate, 10); }
function studyQ(q) { return num(QSTUDY[clamp(Math.round(num(q, 3)), 1, 5)], 1); }
function studyAch(it) { return num(it.h, 0) * studyQ(it.q) * studyRate(); }
function studyTotal(k) { return (peek(k).study || []).reduce(function (a, x) { return a + studyAch(x); }, 0); }
function studyHours(k) { return (peek(k).study || []).reduce(function (a, x) { return a + num(x.h, 0); }, 0); }

/* 成就分解加入学习 */
function dayAchBreak(k) {
  var x = peek(k), task = 0, focus = 0, habit = 0, extra = 0, sleep = sleepTotalOfDay(k), study = studyTotal(k);
  x.todos.forEach(function (t) { task += taskAch(t); });
  x.focus.forEach(function (f) { focus += focusAchOf(f); });
  S.habits.forEach(function (h) { if (habitDoneOn(h, k)) habit += habitAchOf(h); });
  (S.extra || []).forEach(function (e) { if (e.day === k) extra += num(e.val, 0); });
  return {
    task: task, focus: focus, habit: habit, extra: extra, sleep: sleep, study: study,
    total: task + focus + habit + extra + sleep + study
  };
}
/* 记录天数要把学习算进去 */
function hasRecord(k) {
  var x = S.days[k];
  if (!x) return false;
  if (x.study && x.study.length) return true;
  return !!(x.todos.length || x.focus.length || x.money.length || x.water || x.mood || x.text || x.note ||
    (x.good || []).some(function (g) { return g && g.trim(); }) || Object.keys(x.habits || {}).length);
}

var TXTOPS = [
  ['去空行', function (v) { return v.split('\n').filter(function (l) { return l.trim(); }).join('\n'); }],
  ['去首尾空格', function (v) { return v.split('\n').map(function (l) { return l.trim(); }).join('\n'); }],
  ['去所有空格', function (v) { return v.replace(/\s+/g, ''); }],
  ['去重复空格', function (v) { return v.replace(/[ \t]+/g, ' '); }],
  ['去重', function (v) { return v.split('\n').filter(function (l, i, a) { return a.indexOf(l) === i; }).join('\n'); }],
  ['排序', function (v) { return v.split('\n').slice().sort().join('\n'); }],
  ['倒序', function (v) { return v.split('\n').slice().reverse().join('\n'); }],
  ['打乱', function (v) { var a = v.split('\n'); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a.join('\n'); }],
  ['大写', function (v) { return v.toUpperCase(); }],
  ['小写', function (v) { return v.toLowerCase(); }],
  ['首字母大写', function (v) { return v.replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }); }],
  ['去标点', function (v) { return v.replace(/[，。！？、；：""''（）《》〈〉【】,.!?;:'"()\[\]{}<>]/g, ''); }],
  ['去数字', function (v) { return v.replace(/\d/g, ''); }],
  ['只留数字', function (v) { return (v.match(/\d+/g) || []).join(''); }],
  ['去空行+编号', function (v) { var n = 1; return v.split('\n').filter(function (l) { return l.trim(); }).map(function (l) { return (n++) + '. ' + l.trim(); }).join('\n'); }],
  ['去编号', function (v) { return v.split('\n').map(function (l) { return l.replace(/^\s*\d+[.、)．]\s*/, ''); }).join('\n'); }],
  ['全角转半角', function (v) { return v.replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/\u3000/g, ' '); }],
  ['半角转全角', function (v) { return v.replace(/[!-~]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0xFEE0); }).replace(/ /g, '\u3000'); }],

  ['数字求和', function (v) { var m = v.match(/-?\d+(\.\d+)?/g) || []; return m.reduce(function (a, b) { return a + parseFloat(b); }, 0) + '　（' + m.length + ' 个数字）'; }],
  ['倒序每字', function (v) { return v.split('').reverse().join(''); }],

/* ============ 5. 头像：上传自动裁成圆形 ============ */
function cropCircle(dataUrl, size, cb) {
  var im = new Image();
  im.onload = function () {
    try {
      var cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      var cx = cv.getContext('2d');
      var m = Math.min(im.width, im.height);
      var sx = (im.width - m) / 2, sy = (im.height - m) / 2;
      cx.save();
      cx.beginPath();
      cx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      cx.closePath();
      cx.clip();
      cx.drawImage(im, sx, sy, m, m, 0, 0, size, size);
      cx.restore();
      cb(cv.toDataURL('image/png'));
    } catch (e) { cb(dataUrl); }
  };
  im.onerror = function () { cb(dataUrl); };
  im.src = dataUrl;
}

  });
  var WANT = ['focus', 'task', 'money', 'journal', 'habit', 'countdown', 'schulte', 'tools', 'achieve', 'water', 'sleep', 'study'];
  var dock = ['task', 'study', 'money'];
  /* 只在「还没整理过」或旧列表里含已收编应用时才重置，避免每次启动覆盖用户选择 */
